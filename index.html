 let start=null;const dur=reduce?1400:2800;function frame(ts){start=start||ts;const t=ts-start;x.clearRect(0,0,W,H);let alive=0;for(const p of ps){p.vy+=0.35;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<H+20&&t<dur){alive++;x.save();x.globalAlpha=Math.max(0,Math.min(1,(dur-t)/600));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}}if(alive&&t<dur)requestAnimationFrame(frame);else x.clearRect(0,0,W,H)}requestAnimationFrame(frame)}
function celebrate(){chime();confetti();try{navigator.vibrate&&navigator.vibrate([40,30,40])}catch(e){}}

/* ---------- GitHub storage ---------- */
async function request(method,body){const r=await fetch(endpoint()+(method==='GET'?'?ref='+encodeURIComponent(CONFIG.branch)+'&t='+Date.now():''),{method,cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok){const e=Error(v.message||'GitHub request failed');e.status=r.status;throw e}return v}
async function read(){const v=await request('GET');const bytes=Uint8Array.from(atob(v.content.replace(/\s/g,'')),c=>c.charCodeAt(0));const d=JSON.parse(new TextDecoder().decode(bytes));if(!d.settings||!d.tasks||!d.members)throw Error('Invalid database.json');return {d,sha:v.sha}}
const REJECTED='Your saved code was rejected or has expired. Please enter a new one.';
async function refresh(){if(busy||!token)return;try{const x=await read();D=x.d;sha=x.sha;banner('');$('conn').textContent='Synced '+new Date().toLocaleTimeString();$('conn').className='conn live';$('gate').hidden=true;document.body.classList.remove('locked');$('signOutBtn').hidden=false;render();autoWeekly()}catch(e){$('conn').textContent='Not synced';$('conn').className='conn off';if(e.status===401)forgetToken(REJECTED);else banner(D?'Can’t reach GitHub right now — showing the last data. Retrying…':'Can’t load data: '+e.message+'. Retrying… (your code is still saved on this device)')}}
/* op(d) may return false = "nothing to write". opts.fx = celebrate after a confirmed save. */
async function change(label,op,opts={}){if(busy)return;busy=true;document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);try{for(let attempt=0;attempt<5;attempt++){const x=await read();if(op(x.d)===false){D=x.d;sha=x.sha;return}x.d.meta={updatedAt:Date.now()};const bytes=new TextEncoder().encode(JSON.stringify(x.d,null,2));let bin='';for(const b of bytes)bin+=String.fromCharCode(b);try{await request('PUT',{message:'Chore chart: '+label,content:btoa(bin),sha:x.sha,branch:CONFIG.branch});D=x.d;notify(opts.msg||'Saved to GitHub ✓');if(opts.fx)celebrate();return}catch(e){if(e.status!==409&&e.status!==422)throw e;if(attempt===4)throw Error('Conflicting saves. Please retry.')}}}catch(e){if(e.status===401){forgetToken(REJECTED);return}notify('NOT confirmed saved: '+e.message,true)}finally{busy=false;if(D)render()}}

/* ---------- data helpers ---------- */
function records(d=D){return Object.values(d.completions||{}).filter(c=>!c.voided)}
function countIn(id,d,wid){return records(d).filter(c=>c.task===id&&c.week===wid).length}
function count(id,d=D){return countIn(id,d,d.settings.weekId)}
function owner(t){return t.claim?.week===D.settings.weekId?t.claim.member:''}
function isMandatory(t,d=D){return !!(t.claim&&t.claim.mandatory&&t.claim.week===d.settings.weekId)}
function onVacation(id,d=D,date=today()){const v=d.members[id]?.vacation;if(!v||!v.from||!v.to)return false;return v.from<=date&&date<=v.to}
function isDue(t,wno){const e=t.every||1;if(e<=1)return true;const st=t.startWeek??1;return wno>=st&&(wno-st)%e===0}
function nextDueWeekNo(t,wno){const e=t.every||1,st=t.startWeek??1;if(wno<st)return st;return wno+((e-((wno-st)%e))%e||e)}

/* ---------- random weekly mandatory assignment ---------- */
const rand=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
function shuffle(a,rng=rand){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function missedTasks(d,wid,wno){return Object.entries(d.tasks).filter(([id,t])=>t.active&&t.kind==='regular'&&isDue(t,wno)&&countIn(id,d,wid)<t.max).map(([id])=>id)}
function assignMandatory(d,opts={}){
  const s=d.settings,wid=s.weekId,rng=opts.rng||rand;
  let missed=opts.missed;if(!missed){const pn=s.weekNo-1;missed=pn>=1?missedTasks(d,'w'+pn,pn):[]}
  const has=new Set(Object.values(d.tasks).filter(t=>t.claim&&t.claim.mandatory&&t.claim.week===wid).map(t=>t.claim.member));
  const people=shuffle(Object.keys(d.members).filter(id=>!has.has(id)&&!onVacation(id,d,s.weekStart)&&!onVacation(id,d)),rng);
  const pool=Object.entries(d.tasks).filter(([id,t])=>t.active&&t.kind==='regular'&&isDue(t,s.weekNo)&&!(t.claim&&t.claim.week===wid)).map(([id])=>id);
  const w=Number(cfg(d,'missedWeight'))||100;
  for(const pid of people){if(!pool.length)break;const wts=pool.map(id=>missed.includes(id)?w:1),total=wts.reduce((a,b)=>a+b,0);let r=rng()*total,i=0;while(i<pool.length-1&&r>=wts[i]){r-=wts[i];i++}const tid=pool.splice(i,1)[0];d.tasks[tid].claim={member:pid,week:wid,mandatory:true}}
  s.assignedWeek=wid;
}
function rollWeek(d,force){
  const s=d.settings,prevId=s.weekId,prevNo=s.weekNo,target=force?today():weekTarget(cfg(d,'weekStartDay'));
  const elapsed=force?1:Math.max(1,Math.round(diffDays(s.weekStart,target)/7)),missed=missedTasks(d,prevId,prevNo);
  s.weekNo=prevNo+elapsed;s.weekId='w'+s.weekNo;s.weekStart=target;
  Object.values(d.tasks).forEach(t=>delete t.claim);
  assignMandatory(d,{missed});
}
const needsRoll=d=>cfg(d,'autoWeek')&&weekTarget(cfg(d,'weekStartDay'))>d.settings.weekStart;
const needsAssign=d=>cfg(d,'autoWeek')&&d.settings.assignedWeek!==d.settings.weekId;
function autoWeekly(){if(!D||busy||!token||!(needsRoll(D)||needsAssign(D))||Date.now()-lastAuto<30000)return;lastAuto=Date.now();
  change('weekly assignments',d=>{if(needsRoll(d))rollWeek(d,false);else if(needsAssign(d))assignMandatory(d);else return false},{msg:'New week: mandatory chores assigned ✓'})}
function reroll(d){const wid=d.settings.weekId;Object.values(d.tasks).forEach(t=>{if(t.claim&&t.claim.mandatory&&t.claim.week===wid&&!Object.values(d.completions||{}).some(c=>!c.voided&&c.task===t.id&&c.week===wid))delete t.claim});assignMandatory(d)}

/* ---------- member view ---------- */
const excused=(id,t)=>{const o=owner(t);return !!o&&onVacation(o)&&count(id)<t.max};
function card(id,t){
  const n=count(id),o=owner(t),complete=n>=t.max,vac=o&&onVacation(o),mand=isMandatory(t),ex=excused(id,t);
  const acts=[];
  if(!o&&!complete)acts.push(`<button data-action="claim" data-id="${id}">Claim</button>`);
  if(o===me&&me&&!complete)acts.push(`<button class="good" data-action="complete" data-id="${id}">Complete</button>`);
  if(o===me&&me&&n===0&&!mand)acts.push(`<button class="secondary small" data-action="release" data-id="${id}">Give up</button>`);
  return `<article class="task ${complete?'completed':''} ${mand?'mandatory':''} ${ex?'excused':''}"><span>${complete?'✓':''}</span><div><div class="task-name">${esc(t.name)}</div><div class="task-desc">${esc(t.desc||'')}</div><div class="task-meta"><span class="pill">${t.points} pts</span><span class="pill who">${esc(D.members[o]?.name||'Unclaimed')}</span><span class="pill">${n}/${t.max}</span>${mand?'<span class="pill must">🔒 Mandatory</span>':''}${(t.every||1)>1?'<span class="pill bi">Every '+t.every+' weeks</span>':''}${vac?'<span class="pill vac">🌴 Excused</span>':''}</div></div><div class="acts">${acts.join('')}</div></article>`;
}
function vacationCard(){
  const v=D.members[me]?.vacation||{},active=v.from&&v.to&&v.to>=today();

}

  list.map(([id,t])=>{const o=t.claim?.week===D.settings.weekId?t.claim.member:'';return `<details class="crow" data-name="${esc((t.name||'').toLowerCase())}" data-kind="${t.kind}" data-bi="${(t.every||1)>1?1:0}" data-off="${t.active?0:1}"><summary><div style="min-width:0"><div class="nm">${esc(t.name)}</div><div class="pills"><span class="pill ${t.kind==='paid'?'pay':''}">${t.kind==='paid'?'Paid':'Regular'}</span><span class="pill">${t.points} pts</span>${(t.every||1)>1?'<span class="pill bi">Every '+t.every+' wks</span>':''}${isMandatory(t)?'<span class="pill must">🔒 '+esc(D.members[o]?.name||'')+'</span>':o?'<span class="pill who">'+esc(D.members[o]?.name||'')+'</span>':''}${t.active?'':'<span class="pill bad">Hidden</span>'}</div></div></summary><form data-task="${id}">${taskFormFields(t,false)}<label class="check" style="margin:8px 0"><input type="checkbox" name="active" ${t.active?'checked':''}> Visible to everyone</label><div class="savebar"><button>Save</button><button type="button" class="danger" data-delete="${id}">Delete</button></div></form></details>`}).join('')+'</div><div class="empty" id="noChores" hidden>No chores match.</div>';
}
function applyChoreFilter(){const q=aSearch.trim().toLowerCase();let shown=0;document.querySelectorAll('#choreList .crow').forEach(r=>{const ok=(!q||r.dataset.name.includes(q))&&(aFilter==='all'||(aFilter==='regular'&&r.dataset.kind==='regular')||(aFilter==='paid'&&r.dataset.kind==='paid')||(aFilter==='bi'&&r.dataset.bi==='1')||(aFilter==='off'&&r.dataset.off==='1'));r.hidden=!ok;if(ok)shown++});const n=$('noChores');if(n)n.hidden=shown>0}
function aRecords(){
  let list=Object.entries(D.completions||{}).map(([id,c])=>({id,...c})).filter(c=>(recScope==='all'||c.week===D.settings.weekId)&&(!recMember||c.member===recMember)&&(!recKind||c.kind===recKind)).sort((a,b)=>b.at-a.at).slice(0,100);
  return `<h3 class="sec" style="margin-top:14px">Completion records</h3><p class="sub">Voiding hides a record from points and earnings but keeps it, so you can restore it.</p><div class="grid2 keep" style="margin-bottom:8px"><select id="rfScope"><option value="week" ${recScope==='week'?'selected':''}>This week</option><option value="all" ${recScope==='all'?'selected':''}>All time</option></select><select id="rfKind"><option value="">All types</option><option value="regular" ${recKind==='regular'?'selected':''}>Regular</option><option value="paid" ${recKind==='paid'?'selected':''}>Paid</option></select></div><select id="rfMember" style="margin-bottom:10px"><option value="">Everyone</option>${Object.entries(D.members).map(([id,m])=>`<option value="${id}" ${recMember===id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`+
  (list.length?list.map(c=>`<div class="rec ${c.voided?'voided':''}"><div class="t"><b>${esc(c.taskName)}</b><span>${esc(D.members[c.member]?.name||c.memberName)} · ${new Date(c.at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${c.points} pts${c.paymentCents?' · '+money(c.paymentCents)+' ('+mins(c.minutes)+')':''}${c.voided?' · voided':''}</span></div><button class="small ${c.voided?'':'secondary'}" data-void="${c.id}">${c.voided?'Restore':'Void'}</button></div>`).join(''):'<div class="empty">No records match.</div>');
}
function aSettings(){
  const s=D.settings;
  return `<form id="settingsForm"><h3 class="sec" style="margin-top:14px">Settings</h3><fieldset class="fgroup" style="border:1px solid var(--line)"><legend>Pay &amp; points</legend><label>Hourly rate for paid jobs (${esc(s.currency)})</label><input name="rate" type="number" min="0.01" max="1000" step="0.01" value="${s.rateCents/100}" required><p class="hint" style="margin:4px 0 0">New rates apply to future paid jobs only; saved records keep their rate.</p><label>Starting points each week</label><input name="points" type="number" value="${s.startPoints}" required></fieldset>
  <fieldset class="fgroup" style="border:1px solid var(--line)"><legend>Weekly schedule</legend><label class="check"><input type="checkbox" name="auto" ${cfg(D,'autoWeek')?'checked':''}> Start each week automatically and assign mandatory chores</label><label>Week starts on</label><select name="day">${dayNames.map((n,i)=>`<option value="${i+1}" ${cfg(D,'weekStartDay')===i+1?'selected':''}>${n}</option>`).join('')}</select><label>Missed-chore priority <span style="font-weight:400">(higher = last week’s unfinished chores are picked almost every time)</span></label><input name="weight" type="number" min="1" max="1000" value="${cfg(D,'missedWeight')}"></fieldset><div class="savebar"><button>Save settings</button></div></form>`;
}
function aData(){
  return `<h3 class="sec" style="margin-top:14px">Backup &amp; export</h3><div class="actions"><button class="action" data-do="backup"><b>⬇ Download JSON backup</b><span>Full copy of all chores, people and history.</span></button><button class="action" data-do="csv"><b>📊 Export CSV for Excel</b><span>Completion history as a spreadsheet.</span></button></div>
  <h3 class="sec">This device</h3><p class="sub">Your GitHub code is saved on this device, so you stay signed in.</p><div class="actions"><button class="action warn" data-do="signout"><b>🚪 Sign out of this device</b><span>Forgets the saved GitHub code. You’ll need to enter it again.</span></button><button class="action" data-do="lock"><b>🔒 Lock the admin panel</b><span>Ask for the admin password next time.</span></button></div>
  <p class="hint" style="margin-top:16px">The admin password is a simple on-page lock, not real security: anyone with the GitHub code can edit the data file.</p>`;
}
const openAdminPane=()=>{$('drawer').classList.add('open');$('overlay').classList.add('open');renderAdmin()};
function openAdmin(){if(!admin){const p=prompt('Admin password:');if(p===null)return;if(p!==CONFIG.adminPassword){notify('Wrong admin password',true);return}admin=true;sessionStorage.setItem('choreAdmin','1')}openAdminPane()}
function closeAdmin(){$('drawer').classList.remove('open');$('overlay').classList.remove('open')}
function lockAdmin(){admin=false;sessionStorage.removeItem('choreAdmin');closeAdmin();notify('Admin panel locked')}
$('menuBtn').onclick=openAdmin;$('gateAdmin').onclick=e=>{e.preventDefault();openAdmin()};$('closeMenu').onclick=closeAdmin;$('overlay').onclick=closeAdmin;$('lockAdmin').onclick=lockAdmin;
$('signOutBtn').onclick=()=>{if(confirm('Sign out of this device? You will need the GitHub code to sign in again.'))forgetToken('')};
$('drawerBody').addEventListener('input',e=>{adminDirty=true;if(e.target.id==='aSearch'){aSearch=e.target.value;applyChoreFilter()}});
$('drawerBody').addEventListener('change',e=>{const id=e.target.id;if(id==='rfScope'){recScope=e.target.value;renderAdmin()}else if(id==='rfKind'){recKind=e.target.value;renderAdmin()}else if(id==='rfMember'){recMember=e.target.value;renderAdmin()}});
$('drawerBody').addEventListener('click',e=>{
  const t=e.target.closest('[data-atab],[data-chip],[data-do]');if(!t)return;
  if(t.dataset.atab){adminTab=t.dataset.atab;renderAdmin();$('drawerBody').scrollTop=0}
  else if(t.dataset.chip){aFilter=t.dataset.chip;document.querySelectorAll('[data-chip]').forEach(c=>c.classList.toggle('on',c.dataset.chip===aFilter));applyChoreFilter()}
  else{const a=t.dataset.do;
    if(a==='reroll'){if(confirm('Re-roll mandatory chores for people who have not finished theirs?'))change('re-roll mandatory chores',reroll,{msg:'Mandatory chores re-rolled ✓'})}
    else if(a==='newweek'){if(confirm('Start a new week now? Mandatory chores are randomly assigned again. History is kept.'))change('new week',d=>rollWeek(d,true),{msg:'New week started ✓'})}
    else if(a==='fx'){unlockAudio();celebrate()}
    else if(a==='backup')download('database.json',JSON.stringify(D,null,2),'application/json');
    else if(a==='csv')exportCSV();
    else if(a==='signout'){if(confirm('Sign out of this device? You will need the GitHub code to sign in again.'))forgetToken('')}
    else if(a==='lock')lockAdmin()}
});

/* ---------- sign-in ---------- */
$('gateForm').onsubmit=async e=>{e.preventDefault();const t=$('gateKey').value.trim();if(!t)return;token=t;$('gateBtn').disabled=true;$('gateBtn').textContent='Checking…';
  try{const x=await read();D=x.d;sha=x.sha;const persisted=store.set(token);$('gateKey').value='';$('gate').hidden=true;document.body.classList.remove('locked');$('signOutBtn').hidden=false;$('conn').textContent='Connected';$('conn').className='conn live';render();notify(persisted?'Signed in — saved on this device ✓':'Signed in (this browser can’t save it, so you’ll need to re-enter it next time)');autoWeekly()}
  catch(err){token='';gate(err.status===401?'That code was not accepted. Check it and try again.':err.status===404?'Repository or file not found, or this code has no access to it.':err.message)}
  finally{$('gateBtn').disabled=false;$('gateBtn').textContent='Save & continue'}};
$('meSelect').onchange=e=>{me=e.target.value;localStorage.setItem('choreName',me);render()};

/* ---------- member actions (mandatory assignments are protected) ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-person],[data-tab],[data-action],[data-delete],[data-void],[data-vac],[data-clearvac]');if(!b)return;
  if(b.dataset.person){me=b.dataset.person;localStorage.setItem('choreName',me);render()}
  else if(b.dataset.tab){tab=b.dataset.tab;render()}
  else if(b.dataset.delete){adminDirty=false;if(confirm('Delete this chore? History is kept.'))change('delete chore',d=>delete d.tasks[b.dataset.delete],{msg:'Chore deleted'})}
  else if(b.dataset.void){adminDirty=false;change('correct record',d=>{const c=d.completions[b.dataset.void];c.voided=!c.voided},{msg:'Record updated ✓'})}
  else if(b.dataset.vac){if(!me)return;change('back from vacation',d=>{d.members[me].vacation={from:'',to:''}},{msg:'Welcome back! ✓'})}
  else if(b.dataset.clearvac){adminDirty=false;const id=b.dataset.clearvac;change('clear vacation',d=>{d.members[id].vacation={from:'',to:''}},{msg:'Vacation ended ✓'})}
  else if(b.dataset.action){if(!me){notify('Pick your name first',true);return}const id=b.dataset.id,action=b.dataset.action;
    if(action==='claim')change('claim',d=>{const t=d.tasks[id];if(onVacation(me,d))throw Error('You are on vacation. Check back in first.');if(t.claim?.week===d.settings.weekId)throw Error('Already claimed');t.claim={member:me,week:d.settings.weekId}});
    else if(action==='release')change('release',d=>{const t=d.tasks[id];if(t.claim?.member!==me)throw Error('Not yours');if(t.claim.mandatory)throw Error('Mandatory assignments can only be changed by the admin');delete t.claim});
    else complete(id)}});
function complete(id){const task=D.tasks[id],rc=D.settings.rateCents,wid=D.settings.weekId,person=me;let worked=null;const requestId=crypto.randomUUID();
  const submit=()=>change('complete chore',d=>{d.completions ||= {};if(Object.values(d.completions).some(c=>c.requestId===requestId))return false;const t=d.tasks[id];if(!t||!t.active)throw Error('Task unavailable');if(d.settings.weekId!==wid)throw Error('Week changed; reopen task');if(t.claim?.member!==person||t.claim.week!==wid)throw Error('Task is no longer assigned to you');if(count(id,d)>=t.max)throw Error('Already completed this week');if(task.kind!==t.kind)throw Error('Task changed; reopen it');if(t.kind==='paid'&&d.settings.rateCents!==rc)throw Error('Rate changed; reopen task');const c={requestId,task:id,taskName:t.name,member:person,memberName:d.members[person].name,week:wid,weekStart:d.settings.weekStart,kind:t.kind,points:t.kind==='paid'&&d.settings.paidPointMode==='zero'?0:t.points,at:Date.now()};if(t.kind==='paid')Object.assign(c,{minutes:worked,rateCents:rc,paymentCents:Math.round(worked*rc/60)});d.completions[requestId]=c},{fx:true,msg:'Done! Saved to GitHub ✓'});
  if(task.kind!=='paid'){submit();return}
  $('modalWrap').hidden=false;$('modal').innerHTML=`<h3>${esc(task.name)}</h3><p>Time worked at ${money(rc)}/hour</p><div class="grid2 keep"><label>Hours<input id="h" type="number" min="0" max="12" step="1" value="0" inputmode="numeric"></label><label>Minutes<input id="m" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div><div class="quick">${[15,30,45,60,120].map(n=>`<button class="secondary" data-minutes="${n}">${n} min</button>`).join('')}</div><div class="paybox big" id="preview"></div><div class="row"><button id="confirmPay" disabled>Confirm &amp; save</button><button id="cancelPay" class="secondary">Cancel</button></div>`;
  function calc(){worked=Number($('h').value)*60+Number($('m').value);const valid=Number.isInteger(worked)&&worked>=1&&worked<=720&&Number($('h').value)>=0&&Number($('m').value)>=0&&Number($('m').value)<60;$('preview').textContent=money(Math.round(worked*rc/60));$('confirmPay').disabled=!valid}
  $('h').oninput=$('m').oninput=calc;document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{const n=+b.dataset.minutes;$('h').value=Math.floor(n/60);$('m').value=n%60;calc()});$('cancelPay').onclick=()=>{$('modalWrap').hidden=true};$('confirmPay').onclick=()=>{$('modalWrap').hidden=true;submit()};calc()}
document.addEventListener('submit',e=>{const f=e.target;if(f===$('gateForm'))return;e.preventDefault();const v=f.elements;
  if(f.id==='settingsForm'){adminDirty=false;change('settings',d=>{d.settings.rateCents=Math.round(+v.rate.value*100);d.settings.startPoints=+v.points.value;d.settings.autoWeek=v.auto.checked;d.settings.weekStartDay=+v.day.value;d.settings.missedWeight=Math.max(1,+v.weight.value||100)},{msg:'Settings saved ✓'})}
  else if(f.id==='vacForm'){if(!me)return;const from=v.from.value,to=v.to.value;if(!from||!to||to<from){notify('Choose a valid date range',true);return}change('vacation',d=>{d.members[me].vacation={from,to}},{msg:'Vacation saved 🌴'})}
  else if(f.dataset.member){const from=v.vfrom.value,to=v.vto.value;if(!!from!==!!to||(from&&to<from)){notify('Enter both vacation dates (until ≥ from), or leave both empty',true);return}adminDirty=false;change('edit person',d=>{const m=d.members[f.dataset.member];m.name=v.name.value.trim();m.vacation={from,to}},{msg:'Saved ✓'})}
  else if(f.id==='newTask'){adminDirty=false;const id='t'+crypto.randomUUID();const rec={name:v.name.value.trim(),desc:v.desc.value.trim(),kind:v.kind.value,points:+v.points.value,max:+v.max.value||1,active:true,order:Date.now(),every:+v.every.value,startWeek:+v.startWeek.value};change('add chore',d=>{d.tasks[id]=rec},{msg:'Chore added ✓'})}
  else if(f.dataset.task){adminDirty=false;const id=f.dataset.task,rec={name:v.name.value.trim(),desc:v.desc.value.trim(),kind:v.kind.value,points:+v.points.value,max:+v.max.value||1,every:+v.every.value,startWeek:+v.startWeek.value,active:v.active.checked},a=v.assigned.value,mand=v.mandatory.checked;
    change('edit chore',d=>{const t=d.tasks[id];Object.assign(t,rec);if(a==='')delete t.claim;else t.claim={member:a,week:d.settings.weekId,...(mand?{mandatory:true}:{})}},{msg:'Chore saved ✓'})}});

/* ---------- startup ---------- */
async function boot(){try{const x=await read();D=x.d;sha=x.sha;$('signOutBtn').hidden=false;$('conn').textContent='Synced';$('conn').className='conn live';render();autoWeekly()}catch(e){if(e.status===401)forgetToken(REJECTED);else{$('conn').textContent='Not synced';$('conn').className='conn off';banner('Can’t load data: '+e.message+'. Retrying… (your code is still saved on this device)')}}}
if(CONFIG.owner==='YOUR-USERNAME')gate('Edit CONFIG near the top of the script: owner, repo, branch and admin password. Then enter a fine-grained GitHub token with Contents read/write permission for this repository.');
else if(token)boot();else gate();
setInterval(()=>{if(!document.hidden&&token)refresh()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)refresh()});
</script></body></html>
