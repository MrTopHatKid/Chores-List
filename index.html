<script>
const CONFIG={owner:'MrTopHatKid',repo:'Chores-List',branch:'main',path:'database.json',adminPassword:'Ch@ores987!'};
const DEFAULTS={autoWeek:true,weekStartDay:1,missedWeight:100};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- GitHub code is remembered on this device ---------- */
const store={
  get(){try{return localStorage.getItem('choreToken')||sessionStorage.getItem('choreToken')||''}catch(e){try{return sessionStorage.getItem('choreToken')||''}catch(_){return ''}}},
  set(t){try{localStorage.setItem('choreToken',t);sessionStorage.removeItem('choreToken');return true}catch(e){try{sessionStorage.setItem('choreToken',t)}catch(_){}return false}},

let token=store.get(),D=null,sha='',me=localStorage.getItem('choreName')||'',tab='mine',busy=false,lastAuto=0;
let admin=sessionStorage.getItem('choreAdmin')==='1',adminTab='overview',adminDirty=false,aSearch='',aFilter='all',recMember='',recKind='',recScope='week';

const money=n=>(D?.settings.currency||'$')+(n/100).toFixed(2), mins=n=>Math.floor(n/60)+'h '+n%60+'m';
const cfg=(d,k)=>d.settings[k]??DEFAULTS[k];

/* ---------- dates ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>householdToday();
const parse=s=>{const [y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function weekTarget(day){const d=new Date(),isoDow=(d.getDay()+6)%7+1;d.setDate(d.getDate()-((isoDow-day+7)%7));return iso(d)}

/* ---------- feedback ---------- */
function notify(m,err){const t=$('toast');t.textContent=m;t.className='toast show '+(err?'err':'ok');clearTimeout(notify.t);notify.t=setTimeout(()=>t.className='toast',4500)}
function gate(m=''){document.body.classList.add('locked');$('gate').hidden=false;$('signOutBtn').hidden=true;$('gateErr').hidden=!m;$('gateErr').textContent=m}

function forgetToken(msg){store.clear();token='';D=null;sha='';banner('');closeAdmin();gate(msg||'')}

/* ---------- completion effects: sound + confetti + haptics (work on phones) ---------- */
window.__fx={sound:0,confetti:0};
let actx=null,soundOn=localStorage.getItem('choreSound')!=='off';
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=actx||new AC();if(actx.state!=='running'){actx.resume();const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0)}}catch(e){}}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

const excused=(id,t)=>!!D.weeks[D.settings.weekId]?.excluded?.[id];
function card(id,t){
  const n=count(id),o=owner(t),complete=n>=t.max,vac=o&&onVacation(o),mand=isMandatory(t),ex=excused(id,t);
  const acts=[];
  if(!o&&!complete&&t.kind==='paid'&&!onVacation(me))acts.push(`<button data-action="claim" data-id="${id}">Claim</button>`);
  if(o===me&&me&&!complete&&!onVacation(me))acts.push(`<button class="good" data-action="complete" data-id="${id}">Complete</button>`);
  if(o===me&&me&&n===0&&!mand)acts.push(`<button class="secondary small" data-action="release" data-id="${id}">Give up</button>`);
  return `<article class="task ${complete?'completed':''} ${mand?'mandatory':''} ${ex?'excused':''}"><span>${complete?'✓':''}</span><div><div class="task-name">${esc(t.name)}</div><div class="task-desc">${esc(t.desc||'')}</div><div class="task-meta"><span class="pill">${esc(t.difficulty)} · ${workload(t)} workload</span><span class="pill who">${esc(D.members[o]?.name||'Unclaimed')}</span><span class="pill">${n}/${t.max}</span>${mand?'<span class="pill must">🔒 Mandatory</span>':''}${ex?'<span class="pill vac">Authorized exclusion</span>':''}${(t.every||1)>1?'<span class="pill bi">Every '+t.every+' weeks</span>':''}${vac?'<span class="pill vac">🌴 Away</span>':''}</div></div><div class="acts">${acts.join('')}</div></article>`;
}
function vacationCard(){
