<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><title>Chore Chart</title><style>

:root{
  --bg:#f6f7fb;--surface:#fff;--surface-2:#fbfcfe;--text:#111827;--muted:#6b7280;
  --line:#e5e7eb;--line-strong:#d1d5db;--accent:#2563eb;--accent-soft:#eff6ff;
  --green:#059669;--green-soft:#ecfdf5;--amber:#b45309;--amber-soft:#fffbeb;
  --red:#dc2626;--red-soft:#fef2f2;--violet:#7c3aed;--violet-soft:#f5f3ff;
  --radius:14px;--radius-sm:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
[hidden]{display:none!important}
h1,h2,h3,h4{line-height:1.25}
a{color:var(--accent)}
img,canvas{max-width:100%}

/* Header */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);color:var(--text);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header .wrap,main{max-width:1080px;margin:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.15rem,3vw,1.45rem);font-weight:800;letter-spacing:-.02em}
header p{margin:3px 0 0;color:var(--muted);font-size:.86rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conn{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.conn.live{color:#065f46;background:var(--green-soft);border-color:#a7f3d0}.conn.live::before{background:var(--green)}
.conn.off{color:#991b1b;background:var(--red-soft);border-color:#fecaca}.conn.off::before{background:var(--red)}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me label{color:var(--muted);font-weight:650;font-size:.86rem}
.me select{width:auto;min-width:160px;font-weight:650}
.deadline-timer{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:.8rem;white-space:nowrap;color:var(--muted)}
.deadline-timer.soon{background:var(--amber-soft);border-color:#fde68a;color:var(--amber)}

/* Layout and cards */
main{padding:20px 16px 32px}
.banner{background:var(--red-soft);color:#991b1b;border:1px solid #fecaca;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-weight:550}
.card,.person,.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card,.card+div,.people+.tabs{margin-top:14px}

/* Forms and buttons */
input,select,button,textarea{font:inherit}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--green);cursor:pointer;margin:0;flex:none}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:.5}
button{border:1px solid transparent;border-radius:var(--radius-sm);padding:10px 15px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer;transition:filter .15s,background .15s,transform .05s}
button:hover:not(:disabled){filter:brightness(.96)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:var(--accent-soft);color:#1d4ed8;border-color:#bfdbfe}
button.danger{background:var(--red-soft);color:#991b1b;border-color:#fecaca}
button.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
button.small{padding:7px 11px;font-size:.84rem;border-radius:9px}
button.good{background:var(--green)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
.linklike{background:none;border:0;color:var(--muted);font-weight:550;text-decoration:underline;padding:8px;font-size:.85rem}
.linklike:hover{color:var(--text)}

/* Progress */
.progress-track{height:10px;background:#eef1f6;border-radius:999px;overflow:hidden;margin:12px 0}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--green),#34d399);border-radius:999px;transition:width .3s ease}
.status{padding:11px 13px;border-radius:var(--radius-sm);background:var(--green-soft);color:#065f46;font-weight:550}
.status.warn{background:var(--amber-soft);color:var(--amber)}

/* People */
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.person{cursor:pointer;text-align:left;color:inherit;padding:14px;font-weight:400;transition:border-color .15s,box-shadow .15s,background .15s}
.person:hover{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
.person.active{border:2px solid var(--accent);background:var(--accent-soft);box-shadow:none}
.person h3{font-size:.95rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .points{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.person .meta{font-size:.76rem;color:var(--muted)}
.person .money{font-size:.82rem;font-weight:750;color:#92400e;margin-top:3px}
.person.onvacation{background:var(--amber-soft);border-color:#fde68a}

/* Navigation */
.tabs{display:flex;gap:6px;margin:18px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;overflow-x:auto;box-shadow:var(--shadow)}
.tab{background:none;color:var(--muted);border-radius:999px;padding:9px 16px;white-space:nowrap;font-weight:650;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#fff;box-shadow:none}
.section-title{font-size:1.02rem;font-weight:750;margin:18px 0 8px;letter-spacing:-.01em}
.hint{font-size:.87rem;color:var(--muted);margin:4px 0 10px}

/* Tasks */
.task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px}
.task.completed{opacity:.72;background:var(--surface-2)}
.task.completed .task-name{text-decoration:line-through}
.task.mandatory{border-left:4px solid #f59e0b}
.task.excused{opacity:.65;border-style:dashed}
.task-name{font-weight:700}
.task-desc{font-size:.82rem;color:var(--muted);margin-top:2px}
.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.task .acts{display:flex;flex-direction:column;gap:6px;min-width:112px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:.73rem;font-weight:700;background:var(--accent-soft);color:#1d4ed8;white-space:nowrap;border:1px solid transparent}
.pill.pay{background:var(--amber-soft);color:var(--amber);border-color:#fde68a}
.pill.who{background:var(--green-soft);color:#065f46;border-color:#a7f3d0}
.pill.none{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.done{background:var(--green-soft);color:#065f46;border-color:#a7f3d0}
.pill.vac{background:var(--amber-soft);color:var(--amber);border-color:#fde68a}
.pill.must{background:#fef3c7;color:#92400e;border-color:#fde68a}
.pill.bi{background:var(--violet-soft);color:var(--violet);border-color:#ddd6fe}
.pill.bad{background:var(--red-soft);color:#991b1b;border-color:#fecaca}
.difficulty-Easy{background:var(--green-soft);color:#065f46;border-color:#a7f3d0}
.difficulty-Medium{background:var(--accent-soft);color:#1d4ed8;border-color:#bfdbfe}
.difficulty-Hard{background:var(--amber-soft);color:var(--amber);border-color:#fde68a}
.difficulty-VeryHard{background:var(--red-soft);color:#991b1b;border-color:#fecaca}

/* Details, tables, empty states */
.vaccard{margin-bottom:12px;background:var(--amber-soft);border-color:#fde68a}
.vaccard summary{cursor:pointer;font-weight:700;padding:2px 0}
.vaccard h3{margin:0 0 6px}
.empty{padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}

/* Toast / overlays */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:#111827;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:92vw;text-align:center;font-weight:550;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);display:none;z-index:20}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);z-index:50;transform:translateX(100%);visibility:hidden;transition:transform .24s ease,visibility .24s;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:none;visibility:visible}
.drawer-head{background:var(--surface);color:var(--text);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer-head h2{margin:0;font-size:1.1rem;font-weight:800}
.drawer-body{overflow-y:auto;padding:0 16px 48px;flex:1;-webkit-overflow-scrolling:touch}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field label,.lbl{font-size:.8rem;color:var(--muted);font-weight:650}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--text)!important}
.card form label,.modal label{display:block;font-size:.8rem;color:var(--muted);font-weight:650;margin:10px 0 4px}
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.modal{background:var(--surface);border-radius:18px;padding:20px;width:min(480px,100%);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 8px;font-weight:800}
.paybox{background:var(--amber-soft);border:1px solid #fde68a;border-radius:var(--radius);padding:14px;margin:14px 0;color:var(--amber)}
.paybox .big{font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.gate{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;width:min(430px,100%);box-shadow:var(--shadow-lg)}
.gate-card h2{margin:0 0 8px;font-weight:800}
body.locked main,body.locked header .me{visibility:hidden}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:100}
.foot{text-align:center;padding:8px 0 34px}

/* Admin */
.anav{display:flex;gap:7px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.anav button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:#374151;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:.88rem;font-weight:650}
.anav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.apane h3.sec{font-size:1rem;margin:22px 0 5px;font-weight:750}
.apane .sub{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.tile .l{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:1.55rem;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{background:var(--surface);color:var(--text);border:1px solid var(--line);text-align:left;padding:15px;border-radius:var(--radius);display:block;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.action:hover{border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
.action b{display:block;font-size:.97rem}
.action span{display:block;font-weight:450;font-size:.82rem;color:var(--muted);margin-top:3px}
.action.warn{border-color:#fecaca;background:var(--red-soft)}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.listcard .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.listcard .li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:.82rem;color:var(--muted)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.pcard>summary,.crow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px}
.pcard>summary::-webkit-details-marker,.crow>summary::-webkit-details-marker{display:none}
.pcard>summary::after,.crow>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
.pcard[open]>summary::after,.crow[open]>summary::after{content:"▴"}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:#1d4ed8;display:grid;place-items:center;font-weight:800;flex:none}
.pcard form,.crow form{padding:6px 14px 15px;border-top:1px solid var(--line);background:var(--surface-2)}
.crow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.crow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.crow .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.fgroup{border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px 14px;margin:14px 0;background:var(--surface)}
.fgroup>legend,.fgroup>.gt{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.toolbar input{flex:1 1 190px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface);color:#374151;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip.on{background:#111827;color:#fff;border-color:#111827}
.savebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:var(--shadow)}
.rec.voided .t{text-decoration:line-through;opacity:.55}
.rec .t b{display:block}.rec .t span{font-size:.82rem;color:var(--muted)}

/* Task chooser */
.slot-summary h3{margin:0 0 8px}
.slot-count{font-size:1.9rem;font-weight:800;margin:8px 0;letter-spacing:-.03em}
.slot-count span{font-size:.95rem;font-weight:550;color:var(--muted)}
.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.slot-card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);color:var(--text);min-width:0;display:flex;flex-direction:column;gap:12px;align-items:flex-start;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,background .15s}
.slot-card h3{margin:0;font-size:1.03rem;font-weight:750;overflow-wrap:anywhere}
.slot-card.filled{border-color:#a7f3d0;background:var(--green-soft)}
.slot-card.empty-slot{border:1px dashed var(--line-strong);min-height:180px;text-align:left;justify-content:center}
.slot-card.empty-slot:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.slot-label{font-size:.78rem;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.04em}
.slot-plus{font-size:1.9rem;color:var(--accent);line-height:1}
.slot-help{font-size:.82rem;color:var(--muted);font-weight:450}
.slot-card.bonus-slot{border-color:#fde68a;background:var(--amber-soft)}
.slot-card .secondary{margin-top:auto}
.bonus-section{margin-top:22px}
.vac-toggle{display:flex;gap:10px;align-items:center;margin:14px 0}
.work-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.picker-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.picker-task{background:var(--surface);color:var(--text);text-align:left;border:1px solid var(--line);display:flex;flex-direction:column;gap:5px;padding:14px;box-shadow:var(--shadow)}
.picker-task:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.picker-name{font-weight:750;font-size:1rem}
.slot-picker{width:min(640px,100%)}

/* Responsive */
@media(max-width:900px){
  .people{grid-template-columns:repeat(3,minmax(0,1fr))}
  .task-list{grid-template-columns:1fr}
}
@media(max-width:700px){
  body{font-size:16px}
  header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  header .bar{flex-direction:column;align-items:stretch;gap:10px}
  header>div:first-child{text-align:center}
  header p{justify-content:center}
  #weekLabel{width:100%;font-weight:700;color:var(--text)}
  .me{width:100%;gap:8px}
  .me label{display:none}
  .me select{flex:1;min-width:0}
  .me button{min-height:44px}
  main{padding:14px 12px calc(92px + env(safe-area-inset-bottom))}
  input[type=text],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{font-size:16px;min-height:46px}
  button{min-height:46px}
  button.small{min-height:40px;padding:8px 13px}
  .card,.person,.task{padding:13px;border-radius:13px}
  .people{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x proximity;margin:12px -12px;padding:2px 12px 8px;-webkit-overflow-scrolling:touch}
  .person{flex:0 0 150px;scroll-snap-align:start}
  .tabs{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:45;margin:0;gap:4px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--shadow-lg)}
  .tab{flex:1;padding:12px 4px;font-size:.78rem;white-space:normal;text-align:center;min-height:52px;border-radius:14px}
  .task{grid-template-columns:auto minmax(0,1fr);gap:10px 12px}
  .task .acts{grid-column:1/-1;flex-direction:row}
  .task .acts:empty{display:none}
  .task .acts button{flex:1}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .drawer{width:100%}
  .drawer-head{padding-top:max(14px,env(safe-area-inset-top))}
  .grid2{grid-template-columns:1fr}
  .grid2.keep{grid-template-columns:1fr 1fr}
  .actions,.tiles{grid-template-columns:1fr}
  .modal-wrap{align-items:flex-end;padding:0}
  .modal{width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh}
  .quick button{flex:1 1 32%}
  .anav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .anav button{min-height:44px;font-size:.76rem;padding:8px 4px;justify-content:center}
  .slot-grid{grid-template-columns:1fr}
  .slot-card.empty-slot{min-height:155px}
  .picker-task{min-height:100px}
}
@media(max-width:420px){
  .people{flex-wrap:wrap}
  .person{flex:1 1 calc(50% - 8px)}

function complete(id){const task=D.tasks[id],rc=D.settings.rateCents,wid=D.settings.weekId,person=me;let worked=null;const requestId=crypto.randomUUID();
  const submit=()=>change('complete chore',d=>{d.completions ||= {};if(Object.values(d.completions).some(c=>c.requestId===requestId))return false;const t=d.tasks[id];if(!t||!t.active)throw Error('Task unavailable');if(d.settings.weekId!==wid)throw Error('Week changed; reopen task');if(onVacation(person,d))throw Error('Vacation Mode is on. Check back in first.');if(t.claim?.member!==person||t.claim.week!==wid)throw Error('Task is no longer assigned to you');if(count(id,d)>=t.max)throw Error('Already completed this week');if(task.kind!==t.kind)throw Error('Task changed; reopen it');if(t.kind==='paid'&&d.settings.rateCents!==rc)throw Error('Rate changed; reopen task');const c={requestId,task:id,taskName:t.name,member:person,memberName:d.members[person].name,week:wid,weekStart:d.settings.weekStart,kind:t.kind,difficulty:t.difficulty,at:Date.now()};if(t.kind==='paid')Object.assign(c,{minutes:worked,rateCents:rc,paymentCents:Math.round(worked*rc/60)});d.completions[requestId]=c},{fx:true,msg:'Done! Saved to GitHub ✓'});
  if(task.kind!=='paid'){submit();return}
  $('modalWrap').hidden=false;$('modal').innerHTML=`<h3>${esc(task.name)}</h3><p>Time worked at ${money(rc)}/hour</p><div class="grid2 keep"><label>Hours<input id="h" type="number" min="0" max="12" step="1" value="0" inputmode="numeric"></label><label>Minutes<input id="m" type="number" min="0" max="59" step="1" value="0" inputmode="numeric"></label></div><div class="quick">${[15,30,45,60,120].map(n=>`<button class="secondary" data-minutes="${n}">${n} min</button>`).join('')}</div><div class="paybox big" id="preview"></div><div class="row"><button id="confirmPay" disabled>Confirm &amp; save</button><button id="cancelPay" class="secondary">Cancel</button></div>`;
  function calc(){worked=Number($('h').value)*60+Number($('m').value);const valid=Number.isInteger(worked)&&worked>=1&&worked<=720&&Number($('h').value)>=0&&Number($('m').value)>=0&&Number($('m').value)<60;$('preview').textContent=money(Math.round(worked*rc/60));$('confirmPay').disabled=!valid}
  $('h').oninput=$('m').oninput=calc;document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{const n=+b.dataset.minutes;$('h').value=Math.floor(n/60);$('m').value=n%60;calc()});$('cancelPay').onclick=()=>{$('modalWrap').hidden=true};$('confirmPay').onclick=()=>{$('modalWrap').hidden=true;submit()};calc()}
document.addEventListener('submit',e=>{const f=e.target;if(f===$('gateForm')||f.id==='overrideForm'||f.id==='addPersonForm')return;e.preventDefault();const v=f.elements;if(f.id==='vacForm')memberFormDirty=false;

  else if(f.id==='vacForm'){if(!me)return;const from=v.from.value,to=v.to.value;if(!from||!to||to<from){notify('Choose a valid date range',true);return}change('vacation',d=>{d.members[me].vacation={from,to}},{msg:'Vacation saved 🌴'})}

<style>
.task.bonus-highlight{border-left:4px solid #8b5cf6;background:linear-gradient(90deg,#f5f0ff, var(--card,#fff) 65%)}

<script>
/* Controller-managed gifts use the existing compare-and-swap shared save. */
function giftFingerprint(d,tid){return JSON.stringify({claim:d.tasks[tid]?.claim||null,permanent:d.permanentBonus?.[tid]||null})}
function controlsGift(d,tid){const a=d.permanentBonus?.[tid];return !!a&&a.source==='controlled_gift'&&(admin||!!me&&a.controller===me)}
function canStartGift(d,tid){const t=d.tasks[tid];if(!me||!d.members[me]||bonusRequestProblem(d,tid))return false;
 const c=t.claim?.week===d.settings.weekId?t.claim:null;
 return !c||admin||c.member===me;
}
function setGiftRecipient(d,tid,recipient,expected){
 normalize(d);if(!me||!d.members[me])throw Error('Choose your name first');
 if(giftFingerprint(d,tid)!==expected)throw Error('This assignment changed on another device. Refresh and try again.');
 const a=d.permanentBonus[tid],t=d.tasks[tid];
 if(a?!controlsGift(d,tid):!canStartGift(d,tid))throw Error('You do not control this assignment, or it is no longer eligible.');
 if(Object.values(d.bonusRequests).some(r=>r.task===tid&&['pending','approved'].includes(r.status)))throw Error('A bonus request is already being processed.');
 if(recipient){
  if(!d.members[recipient])throw Error('The selected person no longer exists');
  if(vacationOverlaps(recipient,d,d.settings.weekStart))throw Error('This person is away this week. Choose an available person.');
  if(!t.active||t.kind!=='regular'||!isDue(t,d.settings.weekNo)||d.exceptions[d.settings.weekStart]?.[tid])throw Error('This task is not eligible this week');
 }
 // Remove only this task's saved bonus linkage; never alter completions or other tasks.
 for(const mid of Object.keys(d.bonusPreferences))d.bonusPreferences[mid]=d.bonusPreferences[mid].filter(id=>id!==tid);
 for(const p of Object.values(d.plans))delete p[tid];
 if(recipient){
  d.permanentBonus[tid]={member:recipient,controller:a?.controller||me,source:'controlled_gift',originalMember:a?.originalMember||t.claim?.member||null,createdAt:a?.createdAt||Date.now(),updatedAt:Date.now()};
  d.bonusPreferences[recipient].push(tid);d.bonusSlotEnabled[recipient]=true;
  t.claim={member:recipient,week:d.settings.weekId,mandatory:true,kind:'bonus'};
 }else{
  if(!a)throw Error('There is no permanent gift to return');
  delete d.permanentBonus[tid];
  if(t.claim?.kind==='bonus')delete t.claim;
  for(const r of Object.values(d.bonusRequests))if(r.task===tid&&r.status==='assigned'){r.status='removed';r.removedAt=Date.now();r.removedBy=me}
 }
}
function giftButtons(tid){
 if(controlsGift(D,tid))return `<button class="secondary small" data-gift-task="${esc(tid)}">Change recipient</button><button class="secondary small" data-gift-random="${esc(tid)}">Back to random</button>`;
 return canStartGift(D,tid)?`<button class="secondary small" data-gift-task="${esc(tid)}">Give to Whomever</button>`:'';
}
const giftBaseCard=card;
card=function(id,t){let html=giftBaseCard(id,t);const bonus=!!D.permanentBonus[id]||t.claim?.kind==='bonus';
 if(bonus){html=html.replace('class="task ','class="task bonus-highlight ');html=html.replace('<div class="task-meta">','<div class="task-meta"><span class="pill bonus-label">'+(D.permanentBonus[id]?'Permanent bonus':'Bonus task')+'</span>')}
 return html.replace('<div class="acts">','<div class="acts">'+giftButtons(id));
};
const giftBaseChoose=chooseView;
chooseView=function(){let html=giftBaseChoose();if(!me||!D.members[me])return html;
 // Include owned random assignments too; those do not need to request themselves.
 const available=Object.entries(D.tasks).filter(([id])=>canStartGift(D,id));
 const managed=Object.entries(D.permanentBonus).filter(([id])=>controlsGift(D,id));
 const rows=[...available.map(([id,t])=>`<div class="work-row"><span>${esc(t.name)} <span class="pill bonus-label">Random · eligible bonus</span></span><div class="bonus-controls">${giftButtons(id)}</div></div>`),...managed.map(([id,a])=>`<div class="work-row"><span>${esc(D.tasks[id]?.name||id)} <span class="pill bonus-label">Permanent bonus</span><small> → ${esc(D.members[a.member]?.name||a.member)}</small></span><div class="bonus-controls">${giftButtons(id)}</div></div>`)];
 if(rows.length)html+=`<section class="card" style="margin-top:14px"><h3>Give to Whomever</h3><p class="hint">Give an eligible task permanently. You keep control of the recipient and can return it to random assignment. Recorded work stays credited to its original person.</p>${rows.join('')}</section>`;
 return html;
};
function openGiftPicker(tid){
 document.getElementById('giftRecipientDialog')?.remove();const expected=giftFingerprint(D,tid),actor=me;
 const dialog=document.createElement('dialog');dialog.id='giftRecipientDialog';dialog.className='bonus-recipient-dialog';
 const selected=D.permanentBonus[tid]?.member||'';
 dialog.innerHTML=`<form><h3>Give to Whomever</h3><p>${esc(D.tasks[tid]?.name||tid)}</p><label for="giftRecipient">Permanent recipient</label><select id="giftRecipient" required><option value="">Choose a person</option>${Object.entries(D.members).map(([id,m])=>`<option value="${esc(id)}" ${id===selected?'selected':''} ${vacationOverlaps(id,D,D.settings.weekStart)?'disabled':''}>${esc(m.name)}${vacationOverlaps(id,D,D.settings.weekStart)?' (away)':''}</option>`).join('')}</select><p class="hint">Only this task changes. You retain control; completion history and points are preserved.</p><div class="bonus-controls"><button type="submit">Assign permanently</button><button type="button" data-gift-cancel class="secondary">Cancel</button></div></form>`;
 document.body.append(dialog);dialog.querySelector('[data-gift-cancel]').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());
 dialog.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const recipient=dialog.querySelector('select').value;if(!recipient)return;
 const ok=await change('give controlled bonus',d=>{if(me!==actor)throw Error('Selected user changed. Reopen the dialog.');setGiftRecipient(d,tid,recipient,expected)},{msg:'Permanent recipient saved ✓'});if(ok)dialog.close();};dialog.showModal();
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-gift-task],[data-gift-random]');if(!b||busy)return;
 if(b.dataset.giftTask){openGiftPicker(b.dataset.giftTask);return}
 const tid=b.dataset.giftRandom,expected=giftFingerprint(D,tid),actor=me;
 if(!confirm('Remove this permanent gift and return this task to the random pool if eligible? Recorded work and other tasks will not change.'))return;
 await change('return controlled bonus to random',d=>{if(me!==actor)throw Error('Selected user changed');setGiftRecipient(d,tid,null,expected)},{msg:'Permanent gift removed; random eligibility restored ✓'});
});
</script>

<style>

<script>
(()=>{
 const previousChooseView=chooseView;
 chooseView=function(){

  for(const [id,t] of Object.entries(D.tasks||{}))if(t.claim?.week===D.settings.weekId&&t.claim.member===me&&t.claim.kind==='bonus')ids.add(id);
  const items=[...ids].filter(id=>D.tasks[id]);
  const section=`<section class="choose-assigned-bonuses" aria-label="Your bonus tasks"><h3>Your bonus tasks <span class="bonus-slot-label">Bonus · separate from minimum slots</span></h3>${items.length?items.map(id=>{const t=D.tasks[id],a=D.permanentBonus?.[id],active=t.claim?.week===D.settings.weekId&&t.claim.member===me;return `<div data-bonus-assignment="${esc(id)}">${active?card(id,t):`<div class="work-row"><span>${esc(t.name)}</span><span class="bonus-slot-label">${a?'Permanently assigned':'Bonus'}</span></div><p class="hint">Saved assignment; not active for you this week. Availability and vacation rules still apply.</p>${typeof giftButtons==='function'?`<div class="bonus-controls">${giftButtons(id)}</div>`:''}`}</div>`}).join(''):'<p class="hint">No bonus tasks assigned to you yet.</p>'}</section>`;
  const marker='<h3 class="section-title">Minimum task slots</h3>';
  const start=html.indexOf(marker);
  if(start<0)return html+section;
  const gridStart=html.indexOf('<div class="slot-grid">',start+marker.length);
  if(gridStart<0)return html+section;
  // Match the grid's closing div, including nested slot elements.
  const tags=/<\/?div\b[^>]*>/gi;tags.lastIndex=gridStart;let depth=0,m;
  while((m=tags.exec(html))){depth+=/^<\/div/i.test(m[0])?-1:1;if(depth===0){return html.slice(0,tags.lastIndex)+section+html.slice(tags.lastIndex)}}
  return html+section;
 };
 if(typeof D!=='undefined'&&D)render();
})();

<style>

<script>
(()=>{
 const prior=chooseView;
 chooseView=function(){
  const html=prior();if(!me||!D?.members?.[me])return html;
  const root=document.createElement('div');root.innerHTML=html;
  const sections=[...root.querySelectorAll('section')];
  const assigned=sections.find(el=>el.classList.contains('choose-assigned-bonuses'));
  const request=sections.find(el=>[...el.querySelectorAll('h3')].some(h=>h.textContent.trim()==='Request a permanent bonus task'));
  const gift=sections.find(el=>[...el.querySelectorAll('h3')].some(h=>h.textContent.trim()==='Give to Whomever'));
  const panel=document.createElement('section');panel.className='unified-bonus-panel';panel.setAttribute('aria-label','Bonus tasks');
  panel.innerHTML='<h3>Bonus tasks <span class="bonus-layout-tag">Separate from minimum slots</span></h3><p class="hint">Your assignments and available bonus tasks are shown here. Requesting a task needs administrator approval; giving a task uses the existing assignment controls.</p>';
  let populated=false;
  if(assigned){const entries=[...assigned.querySelectorAll('[data-bonus-assignment]')];if(entries.length){const h=document.createElement('h4');h.className='bonus-subheading';h.textContent='Assigned to you';panel.append(h,...entries);populated=true}assigned.remove()}
  const available=new Map();
  function collect(section){if(!section)return;for(const row of section.querySelectorAll('.work-row')){
   const button=row.querySelector('[data-request-bonus],[data-gift-task],[data-gift-random]');if(!button)continue;
   const id=button.dataset.requestBonus||button.dataset.giftTask||button.dataset.giftRandom;
   if(!id)continue;let entry=available.get(id);
   if(!entry){entry=document.createElement('div');entry.className='work-row';const text=document.createElement('span');text.textContent=D.tasks[id]?.name||id;entry.append(text);const controls=document.createElement('div');controls.className='bonus-controls';entry.append(controls);available.set(id,entry)}
   const controls=entry.querySelector('.bonus-controls');for(const b of row.querySelectorAll('[data-request-bonus],[data-gift-task],[data-gift-random]')){
    const key=b.hasAttribute('data-request-bonus')?'data-request-bonus':b.hasAttribute('data-gift-task')?'data-gift-task':'data-gift-random';
    if(!controls.querySelector('['+key+']'))controls.append(b.cloneNode(true));
   }
  }const details=section.querySelector('details');if(details)panel.append(details);section.remove()}
  collect(request);collect(gift);
  if(available.size){const h=document.createElement('h4');h.className='bonus-subheading';h.textContent='Available tasks & assignment controls';panel.append(h,...available.values());populated=true}
  if(!populated){const p=document.createElement('p');p.className='hint';p.textContent='No assigned or eligible bonus tasks are available right now.';panel.append(p)}
  const heading=[...root.querySelectorAll('h3')].find(h=>h.textContent.trim()==='Minimum task slots');
  const grid=heading?.nextElementSibling;
  if(grid?.classList.contains('slot-grid'))grid.after(panel);else root.append(panel);
  return root.innerHTML;
 };
 if(typeof D!=='undefined'&&D)render();
})();

<script>
requestPermanentBonus=function(d,mid,tid){
 normalize(d);if(!mid||mid!==me||!d.members[mid])throw Error('Choose your name first');
 const problem=bonusRequestProblem(d,tid);if(problem)throw Error(problem);
 if(vacationOverlaps(mid,d,d.settings.weekStart))throw Error('You cannot take a bonus chore while away this week');
 const t=d.tasks[tid],now=Date.now(),previous=t.claim?.member||null;
 d.permanentBonus[tid]={member:mid,controller:mid,source:'controlled_gift',originalMember:previous,createdAt:now,updatedAt:now};
 for(const ids of Object.values(d.bonusPreferences))for(let i=ids.length-1;i>=0;i--)if(ids[i]===tid)ids.splice(i,1);
 d.bonusPreferences[mid].push(tid);d.bonusSlotEnabled[mid]=true;
 for(const plan of Object.values(d.plans))delete plan[tid];
 t.claim={member:mid,week:d.settings.weekId,mandatory:true,kind:'bonus'};
};
(()=>{
 const previous=chooseView;
 chooseView=function(){let html=previous();
  html=html.replace(/Request permanently/g,'Take bonus chore')
   .replace(/Request a permanent bonus task/g,'Take a permanent bonus chore')
   .replace(/Administrator approval makes the task permanently yours\./g,'Taking a chore makes it permanently yours immediately after the save succeeds.')
   .replace(/Requesting a task needs administrator approval; giving a task uses the existing assignment controls\./g,'Take an eligible bonus chore immediately, or use Give to Whomever to choose a recipient. No administrator approval is required.')
   .replace(/Work already recorded this week stays with its original user; your permanent assignment applies on the next eligible week\./g,'Recorded work stays credited to its original user. The active assignment changes after the save succeeds.');
  return html;
 };
 document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-request-bonus]');if(!b)return;
  e.preventDefault();e.stopImmediatePropagation();if(busy)return;
  const tid=b.dataset.requestBonus,actor=me;
  const expected=JSON.stringify({claim:D.tasks[tid]?.claim||null,permanent:D.permanentBonus?.[tid]||null});
  if(!confirm('Take this bonus chore permanently? No administrator approval is needed. Recorded work stays credited to its original user.'))return;
  await change('take bonus chore',d=>{
   if(me!==actor)throw Error('Selected user changed. Try again.');
   if(expected!==JSON.stringify({claim:d.tasks[tid]?.claim||null,permanent:d.permanentBonus?.[tid]||null}))throw Error('This chore changed on another device. Refresh and try again.');
   requestPermanentBonus(d,actor,tid);
  },{msg:'Bonus chore assigned permanently ✓'});
 },true);
 if(typeof D!=='undefined'&&D)render();
})();
</script>
<!-- direct-bonus-claim:end -->

<script>
(()=>{
 function assignedBonuses(d,mid){
  const found=new Map();const add=(id,source)=>{if(d.tasks?.[id]){const a=d.permanentBonus?.[id];if(a&&a.member!==mid)return;if(!found.has(id))found.set(id,{id,source})}};
  for(const [id,a] of Object.entries(d.permanentBonus||{}))if(a.member===mid)add(id,'permanent');
  for(const id of d.bonusPreferences?.[mid]||[])add(id,'saved');
  for(const [id,t] of Object.entries(d.tasks||{}))if(t.claim?.member===mid&&t.claim.week===d.settings.weekId&&t.claim.kind==='bonus')add(id,'current');
  const next=typeof nextStart==='function'?nextStart(d):null;
  if(next)for(const [id,c] of Object.entries(d.plans?.[next]||{}))if(c.member===mid&&c.kind==='bonus')add(id,'upcoming');
  return [...found.values()];
 }
 const prior=chooseView;
 chooseView=function(){
  const html=prior();if(!me||!D?.members?.[me])return html;
  const root=document.createElement('div');root.innerHTML=html;
  let panel=root.querySelector('.unified-bonus-panel');
  if(!panel){panel=document.createElement('section');panel.className='unified-bonus-panel';const h=[...root.querySelectorAll('h3')].find(el=>el.textContent.trim()==='Minimum task slots');const grid=h?.nextElementSibling;if(grid?.classList.contains('slot-grid'))grid.after(panel);else root.append(panel)}
  // Keep actionable available-task rows, not nested copies of assignment cards.
  const available=new Map();
  for(const row of panel.querySelectorAll('.work-row')){
   const b=row.querySelector('[data-request-bonus],[data-gift-task],[data-gift-random]');if(!b||row.closest('[data-bonus-assignment]'))continue;
   const id=b.dataset.requestBonus||b.dataset.giftTask||b.dataset.giftRandom;
   if(id&&!available.has(id))available.set(id,row.cloneNode(true));
  }
  const assigned=assignedBonuses(D,me),ids=new Set(assigned.map(a=>a.id));
  panel.innerHTML='<h3>Bonus tasks <span class="bonus-layout-tag">Separate from minimum slots</span></h3>';
  if(assigned.length){
   const h=document.createElement('h4');h.className='bonus-subheading';h.textContent='Assigned to you';panel.append(h);
   for(const {id,source} of assigned){
    const t=D.tasks[id],a=D.permanentBonus?.[id],current=t.claim?.member===me&&t.claim.week===D.settings.weekId;
    const row=document.createElement('div');row.dataset.bonusAssignment=id;
    let state=current?'Assigned this week':source==='upcoming'?'Assigned for next week':'Saved bonus assignment';
    if(!t.active)state+=' · task disabled';else if(typeof vacationOverlaps==='function'&&vacationOverlaps(me,D,D.settings.weekStart))state+=' · vacation rules apply';else if(!isDue(t,D.settings.weekNo))state+=' · not due this week';
    const actions=typeof giftButtons==='function'?giftButtons(id):'';
    row.innerHTML=`<div class="work-row"><span><strong>${esc(t.name)}</strong> <span class="bonus-layout-tag">${a?'Permanent bonus':'Bonus'}</span><div class="hint">${esc(state)}</div></span><div class="bonus-controls">${actions}</div></div>`;
    panel.append(row);
   }
  }
  const other=[...available].filter(([id])=>!ids.has(id));
  if(other.length){const h=document.createElement('h4');h.className='bonus-subheading';h.textContent='Available tasks & assignment controls';panel.append(h,...other.map(([,row])=>row))}
  if(!assigned.length&&!other.length)panel.insertAdjacentHTML('beforeend','<p class="hint">No assigned or eligible bonus tasks are available right now.</p>');
  // Old layout wrappers must not leave a second contradictory assignment panel.
  root.querySelectorAll('.choose-assigned-bonuses').forEach(el=>el.remove());
  return root.innerHTML;
 };
 if(typeof D!=='undefined'&&D)render();
})();
</script>
<!-- bonus-visibility-fix:end -->
