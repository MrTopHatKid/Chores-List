<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chore Chart</title><style>
:root{--bg:#f3f5f9;--card:#fff;--text:#172033;--muted:#64748b;--line:#dfe5ef;--accent:#3659d9;--green:#16845b;--red:#b42335}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}[hidden]{display:none!important}
header{background:#172554;color:#fff;padding:16px}header .wrap,main{max-width:1000px;margin:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.4rem,4vw,1.9rem)}header p{margin:2px 0 0;color:#dbeafe;font-size:.9rem}
.conn{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;font-size:.75rem;background:#ffffff26}.conn.live{background:#16845b}.conn.off{background:#b42335}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.me label{color:#dbeafe;font-weight:600}.me select{width:auto;min-width:150px;font-weight:650}
main{padding:16px 14px 40px}
.banner{background:#feecee;color:#922b3a;border:1px solid #f5c2c9;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card,.person,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px #17255408}
input,select,button{font:inherit}
input[type=text],input[type=number],input[type=password],input[type=date],select{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;color:var(--text)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);cursor:pointer;margin:0}input[type=checkbox]:disabled{cursor:not-allowed;opacity:.5}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#e8edff;color:#233c9c}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:#ffffff26;color:#fff}button.small{padding:6px 11px;font-size:.85rem}button.good{background:var(--green)}
button:focus-visible,input:focus,select:focus{outline:2px solid #93a9ff;outline-offset:1px}
.progress-track{height:12px;background:#e7ebf3;border-radius:99px;overflow:hidden;margin:10px 0}#progressBar{height:100%;width:0;background:var(--green);transition:width .25s}
.status{padding:10px 12px;border-radius:10px;background:#e8f7ef;color:#11643f}.status.warn{background:#fff3dc;color:#7a4b00}
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
.person{cursor:pointer;text-align:left;color:inherit;padding:12px;font-weight:400}.person.active{border:2px solid var(--accent);background:#f5f8ff}
.person h3{font-size:.95rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person .points{font-size:1.5rem;font-weight:750}.person .meta{font-size:.78rem;color:var(--muted)}.person .money{font-size:.85rem;font-weight:700;color:#8a4b05;margin-top:2px}
.person.onvacation{background:#fff8eb;border-color:#f4d9a7}
.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;color:var(--muted);border-radius:9px 9px 0 0;padding:10px 16px;white-space:nowrap}.tab.active{background:#fff;color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.section-title{font-size:1.05rem;font-weight:700;margin:16px 0 8px}.hint{font-size:.88rem;color:var(--muted);margin:4px 0 10px}
.task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}.task.completed{opacity:.75}.task.completed .task-name{text-decoration:line-through}
.task-name{font-weight:650}.task-desc{font-size:.82rem;color:var(--muted);margin-top:2px}.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.task .acts{display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.75rem;background:#e8edff;color:#273c9b;white-space:nowrap}.pill.pay{background:#fff0d9;color:#8a4b05}.pill.who{background:#e6f6ee;color:#11643f}.pill.none{background:#f1f5f9;color:#64748b}.pill.done{background:#e6f6ee;color:#11643f}.pill.vac{background:#fff8eb;color:#75440b;border:1px solid #f4d9a7}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f8fafc;color:var(--muted);font-weight:650;font-size:.78rem}td.num,th.num{text-align:right}tr.voided td{text-decoration:line-through;color:#94a3b8}tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172554;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw;text-align:center}.toast.show{opacity:1}.toast.err{background:#b42335}.toast.ok{background:#16845b}
.overlay{position:fixed;inset:0;background:#0f172a88;display:none;z-index:20}.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:30;transform:translateX(100%);visibility:hidden;transition:transform .22s,visibility .22s;display:flex;flex-direction:column}.drawer.open{transform:none;visibility:visible}
.drawer-head{background:#172554;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;font-size:1.15rem}
.drawer-body{overflow-y:auto;padding:14px;flex:1}
.atabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.atab{background:#e8edff;color:#233c9c;padding:8px 12px;font-size:.88rem}.atab.active{background:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field label,.lbl{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.admin-card{margin-bottom:10px}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}
.modal-wrap{position:fixed;inset:0;background:#0f172acc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal{background:#fff;border-radius:16px;padding:18px;width:min(460px,100%);max-height:92vh;overflow-y:auto}.modal h3{margin:0 0 6px}
.paybox{background:#fff8eb;border:1px solid #f4d9a7;border-radius:12px;padding:12px;margin:12px 0;color:#75440b}.paybox .big{font-size:1.6rem;font-weight:800}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat .l{font-size:.75rem;color:var(--muted)}.stat .v{font-size:1.3rem;font-weight:750}
.gate{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,100%);box-shadow:0 8px 30px #17255418}.gate-card h2{margin:0 0 6px}
body.locked main,body.locked header .me{visibility:hidden}
@media(max-width:800px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}.task-list{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="wrap"><div class="bar">
  <div><h1>Weekly Chore Chart</h1><p><span id="weekLabel"></span> <span class="conn" id="conn">Connecting…</span></p></div>
  <div class="me"><label for="meSelect">I am:</label><select id="meSelect"></select><button class="ghost" id="menuBtn" type="button">&#9881; Admin</button></div>
</div></div></header>
<main>
  <div id="banner" class="banner" hidden></div>
  <section class="card"><div class="bar"><strong id="progressText">Loading…</strong><span class="pill" id="myProgress"></span></div>
    <div class="progress-track"><div id="progressBar"></div></div><div id="overallStatus" class="status warn"></div></section>
  <div class="people" id="people"></div>
  <div class="tabs">
    <button class="tab active" type="button" data-tab="mine">My chores</button>
    <button class="tab" type="button" data-tab="all">All chores</button>
    <button class="tab" type="button" data-tab="paid">Paid jobs &amp; earnings</button>
  </div>
  <div id="tabContent"></div>
</main>
<div class="gate" id="gate" hidden><div class="gate-card">
  <h2>&#128274; Household access key</h2>
  <p class="hint">Enter the access key you were given. It unlocks this device and is needed to save changes.</p>
  <form id="gateForm"><div class="field"><label for="gateKey">Access key</label><input type="password" id="gateKey" autocomplete="off" required></div><button type="submit" id="gateBtn">Unlock</button></form>
  <div id="gateErr" class="status warn" style="margin-top:10px" hidden></div>
  <p class="hint" style="margin-top:14px"><a href="#" id="gateAdmin">Admin sign-in</a></p>
</div></div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Admin menu">
  <div class="drawer-head"><h2>&#9881; Admin menu</h2><div class="row"><button class="ghost small" id="logoutBtn" type="button" hidden>Log out</button><button class="ghost small" id="closeMenu" type="button">Close</button></div></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const CONFIG={owner:'YOUR-USERNAME',repo:'YOUR-REPOSITORY',branch:'main',path:'database.json',adminPassword:'change-me'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('choreToken')||'',D=null,sha='',me=localStorage.getItem('choreName')||'',tab='mine',admin=false,busy=false;
const endpoint=()=>`https://api.github.com/repos/${encodeURIComponent(CONFIG.owner)}/${encodeURIComponent(CONFIG.repo)}/contents/${CONFIG.path.split('/').map(encodeURIComponent).join('/')}`;
const money=n=>(D?.settings.currency||'$')+(n/100).toFixed(2), mins=n=>Math.floor(n/60)+'h '+n%60+'m';
const today=()=>new Date().toLocaleDateString('en-CA');
function notify(m){$('toast').textContent=m;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',4500)}
function gate(m=''){document.body.classList.add('locked');$('gate').hidden=false;$('gateErr').hidden=!m;$('gateErr').textContent=m}
async function request(method,body){const r=await fetch(endpoint()+(method==='GET'?'?ref='+encodeURIComponent(CONFIG.branch)+'&t='+Date.now():''),{method,cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok){const e=Error(v.message||'GitHub request failed');e.status=r.status;throw e}return v}
async function read(){const v=await request('GET');const bytes=Uint8Array.from(atob(v.content.replace(/\s/g,'')),c=>c.charCodeAt(0));const d=JSON.parse(new TextDecoder().decode(bytes));if(!d.settings||!d.tasks||!d.members)throw Error('Invalid database.json');return {d,sha:v.sha}}
async function refresh(){if(busy||!token)return;try{const x=await read();D=x.d;sha=x.sha;$('conn').textContent='Synced '+new Date().toLocaleTimeString();$('conn').className='conn live';render()}catch(e){$('conn').textContent='Not synced';$('conn').className='conn off';if(e.status===401)gate('Invalid or expired token.')}}
async function change(label,op){if(busy)return;busy=true;document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);try{for(let attempt=0;attempt<5;attempt++){const x=await read();op(x.d);x.d.meta={updatedAt:Date.now()};const bytes=new TextEncoder().encode(JSON.stringify(x.d,null,2));let bin='';for(const b of bytes)bin+=String.fromCharCode(b);try{await request('PUT',{message:'Chore chart: '+label,content:btoa(bin),sha:x.sha,branch:CONFIG.branch});D=x.d;notify('Saved to GitHub ✓');return}catch(e){if(e.status!==409&&e.status!==422)throw e;if(attempt===4)throw Error('Conflicting saves. Please retry.')}}}catch(e){notify('NOT confirmed saved: '+e.message)}finally{busy=false;if(D)render()}}
function records(d=D){return Object.values(d.completions||{}).filter(c=>!c.voided)}
function count(id,d=D){return records(d).filter(c=>c.task===id&&c.week===d.settings.weekId).length}
function owner(t){return t.claim?.week===D.settings.weekId?t.claim.member:''}
function onVacation(id,d=D){const v=d.members[id]?.vacation;if(!v||!v.from||!v.to)return false;const t=d.settings.weekStart;return v.from<=t&&t<=v.to}
function render(){if(!D)return;$('weekLabel').textContent='Week of '+D.settings.weekStart;$('meSelect').innerHTML='<option value="">Choose your name</option>'+Object.entries(D.members).map(([id,m])=>`<option value="${id}" ${id===me?'selected':''}>${esc(m.name)}</option>`).join('');const reg=Object.entries(D.tasks).filter(([id,t])=>t.active&&t.kind==='regular'),done=reg.filter(([id,t])=>count(id)>=t.max).length;$('progressText').textContent=`${done} of ${reg.length} chores complete`;$('progressBar').style.width=(reg.length?done/reg.length*100:0)+'%';$('overallStatus').textContent=done===reg.length?'All required chores complete!':'Pick your name, claim a chore and mark it complete.';$('people').innerHTML=Object.entries(D.members).map(([id,m])=>{const r=records().filter(c=>c.member===id),wk=r.filter(c=>c.week===D.settings.weekId),earn=r.reduce((a,c)=>a+(c.paymentCents||0),0),vac=onVacation(id);return `<button class="person ${id===me?'active':''} ${vac?'onvacation':''}" data-person="${id}"><h3>${esc(m.name)}</h3><div class="points">${D.settings.startPoints+wk.reduce((a,c)=>a+c.points,0)} pts</div><div class="money">${money(earn)} earned</div>${vac?'<div class="meta">On vacation until '+esc(m.vacation.to)+'</div>':''}</button>`}).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let ts=Object.entries(D.tasks).filter(([id,t])=>t.active&&(tab==='paid'?t.kind==='paid':t.kind==='regular'));if(tab==='mine')ts=ts.filter(([id,t])=>!owner(t)||owner(t)===me);$('tabContent').innerHTML=(tab==='paid'?`<p class="hint">Optional paid jobs · ${money(D.settings.rateCents)}/hour</p>`:'')+'<div class="task-list">'+ts.map(([id,t])=>{const n=count(id),o=owner(t),complete=n>=t.max,vac=o&&onVacation(o);return `<article class="task ${complete?'completed':''}"><span>${complete?'✓':''}</span><div><div class="task-name">${esc(t.name)}</div><div class="task-desc">${esc(t.desc)}</div><div class="task-meta"><span class="pill">${t.points} pts</span><span class="pill who">${esc(D.members[o]?.name||'Unclaimed')}</span><span class="pill">${n}/${t.max}</span>${vac?'<span class="pill vac">On vacation</span>':''}</div></div><div class="acts">${!o&&!complete?`<button data-action="claim" data-id="${id}">Claim</button>`:''}${o===me&&me&&!complete?`<button class="good" data-action="complete" data-id="${id}">Complete</button>`:''}${o===me&&me&&n===0?`<button class="secondary small" data-action="release" data-id="${id}">Give up</button>`:''}</div></article>`}).join('')+'</div>';
if(tab==='paid')$('tabContent').innerHTML+='<h3>Paid-task history</h3><div class="tablewrap"><table><tr><th>Member</th><th>Task</th><th>Time</th><th>Rate</th><th>Earned</th></tr>'+records().filter(c=>c.kind==='paid').reverse().map(c=>`<tr><td>${esc(D.members[c.member]?.name||c.memberName)}</td><td>${esc(c.taskName)}</td><td>${mins(c.minutes)}</td><td>${money(c.rateCents)}</td><td>${money(c.paymentCents)}</td></tr>`).join('')+'</table></div>';if(admin&&$('drawer').classList.contains('open'))renderAdmin()}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){const rows=[['Member','Task','Date','Type','Points','Minutes','Hourly rate','Payment'],...records().map(c=>[D.members[c.member]?.name,c.taskName,new Date(c.at).toISOString(),c.kind,c.points,c.minutes||'',c.rateCents?c.rateCents/100:'',c.paymentCents?c.paymentCents/100:''])];download('chore-chart.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function renderAdmin(){$('drawerBody').innerHTML=`<div class="row"><button id="backup">Download JSON backup</button><button id="excel" class="secondary">Export CSV for Excel</button><button id="newWeek" class="danger">New week</button></div><form id="settingsForm" class="card"><h3>Settings</h3><label>Hourly rate</label><input name="rate" type="number" min="0.01" max="1000" step="0.01" value="${D.settings.rateCents/100}" required><label>Starting weekly points</label><input name="points" type="number" value="${D.settings.startPoints}" required><button>Save</button></form><h3>People</h3>`+Object.entries(D.members).map(([id,m])=>`<form data-member="${id}" class="row card"><input name="name" maxlength="40" required value="${esc(m.name)}"><button>Save name</button></form>`).join('')+`<h3>Chores</h3><form id="newTask" class="card"><input name="name" placeholder="New chore" maxlength="80" required><select name="kind"><option value="regular">Regular</option><option value="paid">Paid</option></select><input name="points" type="number" min="0" max="100" value="3"><button>Add</button></form>`+Object.entries(D.tasks).map(([id,t])=>`<form data-task="${id}" class="card"><input name="name" required maxlength="80" value="${esc(t.name)}"><select name="kind"><option value="regular" ${t.kind==='regular'?'selected':''}>Regular</option><option value="paid" ${t.kind==='paid'?'selected':''}>Paid</option></select><label>Points</label><input name="points" type="number" min="0" max="100" value="${t.points}"><label>Times per week</label><input name="max" type="number" min="1" max="20" value="${t.max}"><button>Save</button><button type="button" class="danger" data-delete="${id}">Delete</button></form>`).join('')+'<h3>Completion records</h3>'+Object.entries(D.completions||{}).map(([id,c])=>`<div class="card">${esc(c.memberName)} · ${esc(c.taskName)} · ${new Date(c.at).toLocaleString()} ${c.paymentCents?money(c.paymentCents):''} <button class="small secondary" data-void="${id}">${c.voided?'Restore':'Void'}</button></div>`).join('')+'<p class="hint">Admin password is a simple on-page lock, not real security. Anyone with the repository token can edit data.</p>';$('backup').onclick=()=>download('database.json',JSON.stringify(D,null,2),'application/json');$('excel').onclick=exportCSV;$('newWeek').onclick=()=>{if(confirm('Start new week? History is kept.'))change('new week',d=>{d.settings.weekNo++;d.settings.weekId='w'+d.settings.weekNo;d.settings.weekStart=new Date().toLocaleDateString('en-CA');Object.values(d.tasks).forEach(t=>delete t.claim)})}}
$('gateForm').onsubmit=async e=>{e.preventDefault();token=$('gateKey').value.trim();$('gateBtn').disabled=true;try{const x=await read();D=x.d;sha=x.sha;sessionStorage.setItem('choreToken',token);$('gateKey').value='';$('gate').hidden=true;document.body.classList.remove('locked');render();$('conn').textContent='Connected'}catch(e){gate(e.message)}finally{$('gateBtn').disabled=false}};
function openAdmin(){if(!admin&&prompt('Admin password:')!==CONFIG.adminPassword)return;admin=true;$('drawer').classList.add('open');$('overlay').classList.add('open');if(D)renderAdmin();else $('drawerBody').textContent='Unlock with the repository token first.'}
$('menuBtn').onclick=openAdmin;$('gateAdmin').onclick=e=>{e.preventDefault();openAdmin()};function closeAdmin(){admin=false;$('drawer').classList.remove('open');$('overlay').classList.remove('open')}$('closeMenu').onclick=closeAdmin;$('overlay').onclick=closeAdmin;
$('meSelect').onchange=e=>{me=e.target.value;localStorage.setItem('choreName',me);render()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-person],[data-tab],[data-action],[data-delete],[data-void]');if(!b)return;if(b.dataset.person){me=b.dataset.person;localStorage.setItem('choreName',me);render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.delete){if(confirm('Delete chore? History is kept.'))change('delete chore',d=>delete d.tasks[b.dataset.delete])}else if(b.dataset.void)change('correct record',d=>{const c=d.completions[b.dataset.void];c.voided=!c.voided});else if(b.dataset.action){if(!me){notify('Pick your name first');return}const id=b.dataset.id,action=b.dataset.action;if(action==='claim')change('claim',d=>{const t=d.tasks[id];if(t.claim?.week===d.settings.weekId)throw Error('Already claimed');t.claim={member:me,week:d.settings.weekId}});else if(action==='release')change('release',d=>{const t=d.tasks[id];if(t.claim?.member!==me)throw Error('Not yours');delete t.claim});else complete(id)}});
function complete(id){const task=D.tasks[id],rc=D.settings.rateCents,wid=D.settings.weekId,person=me;let worked=null;const requestId=crypto.randomUUID();const submit=()=>change('complete chore',d=>{d.completions ||= {};if(Object.values(d.completions).some(c=>c.requestId===requestId))return;const t=d.tasks[id];if(!t||!t.active)throw Error('Task unavailable');if(d.settings.weekId!==wid)throw Error('Week changed; reopen task');if(t.claim?.member!==person||t.claim.week!==wid)throw Error('Task is no longer assigned to you');if(count(id,d)>=t.max)throw Error('Already completed this week');if(task.kind!==t.kind)throw Error('Task changed; reopen it');if(t.kind==='paid'&&d.settings.rateCents!==rc)throw Error('Rate changed; reopen task');const c={requestId,task:id,taskName:t.name,member:person,memberName:d.members[person].name,week:wid,weekStart:d.settings.weekStart,kind:t.kind,points:t.kind==='paid'&&d.settings.paidPointMode==='zero'?0:t.points,at:Date.now()};if(t.kind==='paid')Object.assign(c,{minutes:worked,rateCents:rc,paymentCents:Math.round(worked*rc/60)});d.completions[requestId]=c});if(task.kind!=='paid'){submit();return}$('modalWrap').hidden=false;$('modal').innerHTML=`<h3>${esc(task.name)}</h3><p>Time worked at ${money(rc)}/hour</p><div class="grid2"><label>Hours<input id="h" type="number" min="0" max="12" step="1" value="0"></label><label>Minutes<input id="m" type="number" min="0" max="59" step="1" value="0"></label></div><div class="quick">${[15,30,45,60,120].map(n=>`<button data-minutes="${n}">${n} min</button>`).join('')}</div><div class="paybox big" id="preview"></div><button id="confirmPay" disabled>Confirm & save</button> <button id="cancelPay" class="secondary">Cancel</button>`;function calc(){worked=Number($('h').value)*60+Number($('m').value);const valid=Number.isInteger(worked)&&worked>=1&&worked<=720&&Number($('h').value)>=0&&Number($('m').value)>=0&&Number($('m').value)<60;$('preview').textContent=money(Math.round(worked*rc/60));$('confirmPay').disabled=!valid}$('h').oninput=$('m').oninput=calc;document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{const n=+b.dataset.minutes;$('h').value=Math.floor(n/60);$('m').value=n%60;calc()});$('cancelPay').onclick=()=>{$('modalWrap').hidden=true};$('confirmPay').onclick=()=>{$('modalWrap').hidden=true;submit()};calc()}
document.addEventListener('submit',e=>{const f=e.target;if(f=== $('gateForm'))return;e.preventDefault();const v=f.elements;if(f.id==='settingsForm')change('settings',d=>{d.settings.rateCents=Math.round(+v.rate.value*100);d.settings.startPoints=+v.points.value});else if(f.dataset.member)change('rename',d=>d.members[f.dataset.member].name=v.name.value.trim());else if(f.id==='newTask'){const id='t'+crypto.randomUUID();const rec={name:v.name.value.trim(),desc:'',kind:v.kind.value,points:+v.points.value,max:1,active:true,order:Date.now()};change('add chore',d=>d.tasks[id]=rec)}else if(f.dataset.task){const id=f.dataset.task,rec={name:v.name.value.trim(),kind:v.kind.value,points:+v.points.value,max:+v.max.value};change('edit chore',d=>Object.assign(d.tasks[id],rec))}});
if(CONFIG.owner==='YOUR-USERNAME')gate('Edit CONFIG near the top of the script: owner, repo, branch and admin password. Then enter a fine-grained GitHub token with Contents read/write permission for this repository.');else if(token)read().then(x=>{D=x.d;sha=x.sha;render()}).catch(e=>gate(e.message));else gate();
setInterval(()=>{if(!document.hidden&&D)refresh()},20000);
</script></body></html>
