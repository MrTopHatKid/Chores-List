<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Chore Chart</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#172033;--muted:#64748b;--line:#dfe5ef;--accent:#3659d9;--green:#16845b;--red:#b42335}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
[hidden]{display:none!important}
header{background:#172554;color:#fff;padding:16px}header .wrap,main{max-width:1000px;margin:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(1.4rem,4vw,1.9rem)}header p{margin:2px 0 0;color:#dbeafe;font-size:.9rem}
.conn{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;font-size:.75rem;background:#ffffff26}.conn.live{background:#16845b}.conn.off{background:#b42335}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.me label{color:#dbeafe;font-weight:600}.me select{width:auto;min-width:150px;font-weight:650}
main{padding:16px 14px 20px}
.banner{background:#feecee;color:#922b3a;border:1px solid #f5c2c9;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.setup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}.setup ol{padding-left:20px}.setup li{margin:6px 0}.setup textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;height:180px}
.card,.person,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px #17255408}
input,select,button,textarea{font:inherit}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=password],select,textarea{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;color:var(--text)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);cursor:pointer;margin:0}input[type=checkbox]:disabled{cursor:not-allowed;opacity:.5}
button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#e8edff;color:#233c9c}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:#ffffff26;color:#fff}button.small{padding:6px 11px;font-size:.85rem}button.good{background:var(--green)}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid #93a9ff;outline-offset:1px}
.progress-track{height:12px;background:#e7ebf3;border-radius:99px;overflow:hidden;margin:10px 0}#progressBar{height:100%;width:0;background:var(--green);transition:width .25s}
.status{padding:10px 12px;border-radius:10px;background:#e8f7ef;color:#11643f}.status.warn{background:#fff3dc;color:#7a4b00}
.people{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
.person{cursor:pointer;text-align:left;color:inherit;padding:12px;font-weight:400}.person.active{border:2px solid var(--accent);background:#f5f8ff}
.person h3{font-size:.95rem;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person .points{font-size:1.5rem;font-weight:750}.person .meta{font-size:.78rem;color:var(--muted)}.person .money{font-size:.85rem;font-weight:700;color:#8a4b05;margin-top:2px}
.tabs{display:flex;gap:6px;margin:18px 0 12px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;color:var(--muted);border-radius:9px 9px 0 0;padding:10px 16px;white-space:nowrap}.tab.active{background:#fff;color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.section-title{font-size:1.05rem;font-weight:700;margin:16px 0 8px}.hint{font-size:.88rem;color:var(--muted);margin:4px 0 10px}
.task-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}.task.completed{opacity:.75}.task.completed .task-name{text-decoration:line-through}
.task-name{font-weight:650}.task-desc{font-size:.82rem;color:var(--muted);margin-top:2px}.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.task .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.75rem;background:#e8edff;color:#273c9b;white-space:nowrap}.pill.pay{background:#fff0d9;color:#8a4b05}.pill.who{background:#e6f6ee;color:#11643f}.pill.none{background:#f1f5f9;color:#64748b}.pill.done{background:#e6f6ee;color:#11643f}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f8fafc;color:var(--muted);font-weight:650;font-size:.78rem}td.num,th.num{text-align:right}tr.voided td{text-decoration:line-through;color:#94a3b8}tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172554;color:#fff;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:92vw;text-align:center}.toast.show{opacity:1}.toast.err{background:#b42335}.toast.ok{background:#16845b}
.overlay{position:fixed;inset:0;background:#0f172a88;display:none;z-index:20}.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:30;transform:translateX(100%);visibility:hidden;transition:transform .22s,visibility .22s;display:flex;flex-direction:column}.drawer.open{transform:none;visibility:visible}
.drawer-head{background:#172554;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;font-size:1.15rem}
.drawer-body{overflow-y:auto;padding:14px;flex:1}
.atabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.atab{background:#e8edff;color:#233c9c;padding:8px 12px;font-size:.88rem}.atab.active{background:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}.field label,.lbl{font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.admin-card{margin-bottom:10px}.admin-card .full{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}
.modal-wrap{position:fixed;inset:0;background:#0f172acc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal{background:#fff;border-radius:16px;padding:18px;width:min(460px,100%);max-height:92vh;overflow-y:auto}.modal h3{margin:0 0 6px}
.paybox{background:#fff8eb;border:1px solid #f4d9a7;border-radius:12px;padding:12px;margin:12px 0;color:#75440b}.paybox .big{font-size:1.6rem;font-weight:800}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat .l{font-size:.75rem;color:var(--muted)}.stat .v{font-size:1.3rem;font-weight:750}
.gate{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,100%);box-shadow:0 8px 30px #17255418}.gate-card h2{margin:0 0 6px}
body.locked main,body.locked header .me{visibility:hidden}
.foot{text-align:center;padding:0 0 30px}.linklike{background:none;color:var(--muted);font-weight:500;text-decoration:underline;padding:6px}
@media(max-width:800px){.people{grid-template-columns:repeat(2,minmax(0,1fr))}.task-list{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <div><h1>Weekly Chore Chart</h1><p><span id="weekLabel"></span> <span class="conn" id="conn" title="Live connection to the shared database">Connecting…</span></p></div>
    <div class="me">
      <label for="meSelect">I am:</label><select id="meSelect"></select>
      <button class="ghost" id="menuBtn" type="button">&#9881; Admin</button>
    </div>
  </div>
</div></header>
<main>
  <div id="banner" class="banner" hidden></div>
  <div id="setupGuide" class="setup" hidden></div>
  <section class="card">
    <div class="bar"><strong id="progressText">Loading…</strong><span class="pill" id="myProgress"></span></div>
    <div class="progress-track"><div id="progressBar"></div></div>
    <div id="overallStatus" class="status warn"></div>
  </section>
  <div class="people" id="people"></div>
  <div class="tabs">
    <button class="tab active" type="button" data-tab="mine">My chores</button>
    <button class="tab" type="button" data-tab="all">All chores</button>
    <button class="tab" type="button" data-tab="paid">Paid jobs &amp; earnings</button>
  </div>
  <div id="tabContent"></div>
</main>
<footer class="foot"><button type="button" class="linklike" id="lockBtn" hidden>&#128274; Lock this device</button></footer>
<div class="gate" id="gate" hidden><div class="gate-card">
  <h2>&#128274; Household access key</h2>
  <p class="hint">Enter the access key you were given to open the chore chart. You only need to do this once on each device.</p>
  <form id="gateForm"><div class="field"><label for="gateKey">Access key</label><input type="password" id="gateKey" autocomplete="off" required></div><button type="submit" id="gateBtn">Unlock</button></form>
  <div id="gateErr" class="status warn" style="margin-top:10px" hidden></div>
  <p class="hint" style="margin-top:14px"><a href="#" id="gateAdmin">Admin sign-in</a></p>
</div></div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Admin panel">
  <div class="drawer-head"><h2>&#9881; Admin panel</h2><div class="row"><button class="ghost small" id="logoutBtn" type="button" hidden>Log out</button><button class="ghost small" id="closeMenu" type="button">Close</button></div></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
const RULES = "{\n  \"rules\": {\n    \".read\": false,\n    \".write\": false,\n    \"admins\": {\n      \"$uid\": {\n        \".read\": \"auth != null && auth.uid === $uid\",\n        \".write\": false\n      }\n    },\n    \"accessKey\": {\n      \".read\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \".validate\": \"newData.isString() && newData.val().length >= 8 && newData.val().length <= 64\"\n    },\n    \"sessions\": {\n      \".read\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"$uid\": {\n        \".write\": \"auth != null && auth.uid === $uid && (!newData.exists() || newData.val() === root.child('accessKey').val())\",\n        \".validate\": \"newData.isString()\"\n      }\n    },\n    \"audit\": {\n      \".read\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"$id\": {\n        \".validate\": \"newData.hasChildren(['at','action','by'])\",\n        \"$o\": {\n          \".validate\": true\n        }\n      }\n    },\n    \"settings\": {\n      \".read\": \"(auth != null && root.child('admins').child(auth.uid).val() === true) || (auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val())\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"rateCents\": {\n        \".validate\": \"newData.isNumber() && newData.val() >= 1 && newData.val() <= 100000 && newData.val() % 1 === 0\"\n      },\n      \"startPoints\": {\n        \".validate\": \"newData.isNumber() && newData.val() >= -1000 && newData.val() <= 1000\"\n      },\n      \"defaultQuota\": {\n        \".validate\": \"newData.isNumber() && newData.val() >= 0 && newData.val() <= 50\"\n      },\n      \"paidPointMode\": {\n        \".validate\": \"newData.val() === 'points' || newData.val() === 'zero'\"\n      },\n      \"currency\": {\n        \".validate\": \"newData.isString() && newData.val().length >= 1 && newData.val().length <= 4\"\n      },\n      \"autoReset\": {\n        \".validate\": \"newData.isBoolean()\"\n      },\n      \"resetWeekday\": {\n        \".validate\": \"newData.isNumber() && newData.val() >= 1 && newData.val() <= 7\"\n      },\n      \"weekNo\": {\n        \".write\": \"(auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val()) && root.child('settings/autoReset').val() === true && newData.val() === data.val() + 1\",\n        \".validate\": \"newData.isNumber()\"\n      },\n      \"weekId\": {\n        \".write\": \"(auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val()) && root.child('settings/autoReset').val() === true && newData.parent().child('weekNo').val() === data.parent().child('weekNo').val() + 1\",\n        \".validate\": \"newData.isString() && newData.val().matches(/^w[0-9]+$/)\"\n      },\n      \"weekStart\": {\n        \".write\": \"(auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val()) && root.child('settings/autoReset').val() === true && newData.parent().child('weekNo').val() === data.parent().child('weekNo').val() + 1\",\n        \".validate\": \"newData.isString() && newData.val().matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)\"\n      },\n      \"$other\": {\n        \".validate\": false\n      }\n    },\n    \"members\": {\n      \".read\": \"(auth != null && root.child('admins').child(auth.uid).val() === true) || (auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val())\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"$m\": {\n        \".validate\": \"$m.matches(/^m[1-5]$/) && newData.hasChildren(['name','quota'])\",\n        \"name\": {\n          \".validate\": \"newData.isString() && newData.val().length >= 1 && newData.val().length <= 40\"\n        },\n        \"quota\": {\n          \".validate\": \"newData.isNumber() && newData.val() >= 0 && newData.val() <= 50\"\n        },\n        \"$other\": {\n          \".validate\": false\n        }\n      }\n    },\n    \"tasks\": {\n      \".read\": \"(auth != null && root.child('admins').child(auth.uid).val() === true) || (auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val())\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"$t\": {\n        \".validate\": \"newData.hasChildren(['name','kind','points','max','active','order','slots'])\",\n        \"name\": {\n          \".validate\": \"newData.isString() && newData.val().length >= 1 && newData.val().length <= 80\"\n        },\n        \"desc\": {\n          \".validate\": \"newData.isString() && newData.val().length <= 300\"\n        },\n        \"kind\": {\n          \".validate\": \"newData.val() === 'regular' || newData.val() === 'paid'\"\n        },\n        \"points\": {\n          \".validate\": \"newData.isNumber() && newData.val() >= 0 && newData.val() <= 100 && newData.val() % 1 === 0\"\n        },\n        \"max\": {\n          \".validate\": \"newData.isNumber() && newData.val() >= 1 && newData.val() <= 20 && newData.val() % 1 === 0\"\n        },\n        \"active\": {\n          \".validate\": \"newData.isBoolean()\"\n        },\n        \"order\": {\n          \".validate\": \"newData.isNumber()\"\n        },\n        \"slots\": {\n          \"$s\": {\n            \".validate\": \"newData.val() === true && $s.matches(/^s([1-9]|1[0-9]|20)$/)\"\n          }\n        },\n        \"claim\": {\n          \".write\": \"(auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val()) && ((newData.exists() && (!data.exists() || data.child('week').val() !== root.child('settings/weekId').val())) || (!newData.exists() && data.exists() && !root.child('completions').child(data.child('week').val() + '_' + $t + '_s1').exists()))\",\n          \".validate\": \"newData.hasChildren(['member','week']) && newData.child('member').val().matches(/^m[1-5]$/) && newData.child('week').val().matches(/^w[0-9]+$/) && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.child('week').val() === root.child('settings/weekId').val())\",\n          \"member\": {\n            \".validate\": \"newData.isString()\"\n          },\n          \"week\": {\n            \".validate\": \"newData.isString()\"\n          },\n          \"$other\": {\n            \".validate\": false\n          }\n        },\n        \"$other\": {\n          \".validate\": false\n        }\n      }\n    },\n    \"completions\": {\n      \".read\": \"(auth != null && root.child('admins').child(auth.uid).val() === true) || (auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val())\",\n      \".write\": \"auth != null && root.child('admins').child(auth.uid).val() === true\",\n      \"$key\": {\n        \".write\": \"(auth != null && root.child('accessKey').exists() && root.child('sessions').child(auth.uid).val() === root.child('accessKey').val()) && ((!data.exists() && newData.exists()) || (data.exists() && !newData.exists() && data.child('kind').val() === 'regular' && data.child('week').val() === root.child('settings/weekId').val()))\",\n        \".validate\": \"newData.hasChildren(['member','memberName','task','taskName','kind','week','weekStart','slot','points','at']) && (newData.child('kind').val() === 'regular' || newData.hasChildren(['minutes','rateCents','paymentCents'])) && (auth != null && root.child('admins').child(auth.uid).val() === true || ($key === newData.child('week').val() + '_' + newData.child('task').val() + '_' + newData.child('slot').val() && !newData.child('voided').exists()))\",\n        \"member\": {\n          \".validate\": \"newData.isString() && newData.val().matches(/^m[1-5]$/) && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.parent().child('memberName').val() === root.child('members').child(newData.val()).child('name').val())\"\n        },\n        \"memberName\": {\n          \".validate\": \"newData.isString() && newData.val().length <= 40\"\n        },\n        \"task\": {\n          \".validate\": \"newData.isString()\"\n        },\n        \"taskName\": {\n          \".validate\": \"newData.isString() && newData.val().length <= 80 && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === root.child('tasks').child(newData.parent().child('task').val()).child('name').val())\"\n        },\n        \"kind\": {\n          \".validate\": \"(newData.val() === 'regular' || newData.val() === 'paid') && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === root.child('tasks').child(newData.parent().child('task').val()).child('kind').val())\"\n        },\n        \"week\": {\n          \".validate\": \"newData.isString() && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === root.child('settings/weekId').val())\"\n        },\n        \"weekStart\": {\n          \".validate\": \"newData.isString() && newData.val().matches(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/)\"\n        },\n        \"slot\": {\n          \".validate\": \"newData.isString() && (auth != null && root.child('admins').child(auth.uid).val() === true || root.child('tasks').child(newData.parent().child('task').val()).child('slots').child(newData.val()).val() === true)\"\n        },\n        \"points\": {\n          \".validate\": \"newData.isNumber() && newData.val() % 1 === 0 && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === (newData.parent().child('kind').val() === 'paid' && root.child('settings/paidPointMode').val() === 'zero' ? 0 : root.child('tasks').child(newData.parent().child('task').val()).child('points').val()))\"\n        },\n        \"minutes\": {\n          \".validate\": \"newData.isNumber() && newData.val() % 1 === 0 && newData.val() >= 1 && newData.val() <= 720 && newData.parent().child('kind').val() === 'paid'\"\n        },\n        \"rateCents\": {\n          \".validate\": \"newData.isNumber() && newData.val() >= 1 && newData.val() <= 100000 && newData.parent().child('kind').val() === 'paid' && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === root.child('settings/rateCents').val())\"\n        },\n        \"paymentCents\": {\n          \".validate\": \"newData.isNumber() && newData.val() % 1 === 0 && newData.val() >= 0 && newData.parent().child('kind').val() === 'paid' && (auth != null && root.child('admins').child(auth.uid).val() === true || (newData.val() * 60 >= newData.parent().child('minutes').val() * newData.parent().child('rateCents').val() - 30 && newData.val() * 60 <= newData.parent().child('minutes').val() * newData.parent().child('rateCents').val() + 30))\"\n        },\n        \"at\": {\n          \".validate\": \"newData.isNumber() && (auth != null && root.child('admins').child(auth.uid).val() === true || newData.val() === now)\"\n        },\n        \"voided\": {\n          \".validate\": \"newData.isBoolean() && auth != null && root.child('admins').child(auth.uid).val() === true\"\n        },\n        \"voidReason\": {\n          \".validate\": \"newData.isString() && newData.val().length <= 200 && auth != null && root.child('admins').child(auth.uid). function derive(){
  S.settings=raw.settings;
  S.members=Object.keys(raw.members||{}).sort().map(k=>Object.assign({id:k},raw.members[k]));
  S.tasks=Object.keys(raw.tasks||{}).map(k=>Object.assign({id:k},raw.tasks[k])).sort((a,b)=>(a.order||0)-(b.order||0));
  const c=raw.completions||{};

  S.comps=Object.keys(c).map(k=>Object.assign({key:k},c[k])).sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0));
}

function totals(){
  const wk=weekComps();
  return S.members.map(m=>{
    const mine=wk.filter(c=>c.member===m.id),wkPaid=mine.filter(c=>c.kind==="paid");
    const allPaid=S.comps.filter(c=>c.member===m.id&&c.kind==="paid"&&!c.voided);
    const sum=(a,f)=>a.reduce((x,c)=>x+(Number(c[f])||0),0);
    return{id:m.id,points:S.settings.startPoints+sum(mine,"points"),regDone:mine.filter(c=>c.kind==="regular").length,
      assigned:regularTasks().filter(t=>claimOf(t)===m.id).length,
      weekEarn:sum(wkPaid,"paymentCents"),weekMin:sum(wkPaid,"minutes"),weekJobs:wkPaid.length,
      allEarn:sum(allPaid,"paymentCents"),allMin:sum(allPaid,"minutes"),allJobs:allPaid.length};
  });
}

/* ---------- writes: "saved" only after the server confirms ---------- */
class AppError extends Error{constructor(m,code){super(m);this.code=code}}
async function write(fn){
  if(!connected)throw new AppError("You’re offline. Your change was NOT saved.","net");
  let timer;
  const timeout=new Promise((_,rej)=>{timer=setTimeout(()=>rej(new AppError("The database did not confirm in time. Check your connection and refresh before trying again.","timeout")),10000)});
  try{return await Promise.race([fn(),timeout])}
  catch(e){
    if(e instanceof AppError)throw e;
    if(e&&(e.code==="PERMISSION_DENIED"||/permission_denied/i.test(e.message||"")))throw new AppError("The database refused this change — it may already be done, someone else got there first, or your access key is no longer valid.","denied");
    throw new AppError((e&&e.message)||"Save failed","err");
  }finally{clearTimeout(timer)}
}
const reportError=e=>toast(e.message||String(e),"err");
async function adminWrite(fn,okMsg){
  if(!isAdmin){toast("Please log in as admin first.","err");return false}
  try{await write(fn);if(okMsg)toast(okMsg,"ok");return true}
  catch(e){if(e.code==="denied")e=new AppError("Not allowed. Your login must be an admin (your UID has to be listed under “admins” in the database).","denied");reportError(e);return false}
}
function audit(action,details){if(!isAdmin)return;try{db.ref("audit").push({at:SERVER_TS,action,by:adminUser.email||adminUser.uid,details:JSON.stringify(details||{}).slice(0,400)})}catch(e){}}

/* ---------- live data (starts only after the access key / admin login is accepted) ---------- */
const PATHS=["settings","members","tasks","completions"];
let started=false;
function listen(path){
  db.ref(path).on("value",snap=>{
    raw[path]=snap.val();loaded[path]=true;
    if(Object.values(loaded).every(Boolean)){
      if(!raw.settings||!raw.members||!raw.tasks){showBanner("<strong>The database is empty.</strong> In the Firebase console: Data tab → ⋮ → Import JSON → choose <code>database.json</code>.");return}
      derive();S.ready=true;hideBanner();
      if(me!==""&&!member(me)){me="";lsSet(ME_KEY,"")}
      renderAll();maybeRoll();
    }
  },err=>{
    if(/permission/i.test((err.code||"")+(err.message||""))){stopData();showGate("Your access key is no longer valid. Please enter the current key.")}
    else showBanner("<strong>Can’t read the database.</strong> "+esc(err.message||"")+" Check the security rules in the Rules tab.");
  });
}
function startData(){if(started)return;started=true;PATHS.forEach(listen)}
function stopData(){PATHS.forEach(p=>{try{db.ref(p).off()}catch(e){}loaded[p]=false;raw[p]=null});started=false;S.ready=false}
db.ref(".info/connected").on("value",s=>{connected=!!s.val();const el=$("conn");el.className="conn "+(connected?"live":"off");el.textContent=connected?"● Live":"● Offline"});

  const s=S.settings;if(!s||!s.autoReset||!connected)return;

  if(target>s.weekStart){const n=s.weekNo+1;db.ref().update({"settings/weekNo":n,"settings/weekId":"w"+n,"settings/weekStart":target}).catch(()=>{})}
}

function taskCard(t){

/* ---------- member actions ---------- */
async function guarded(key,fn){
  if(busy.has(key))return;busy.add(key);renderTab();
  try{await fn()}catch(e){reportError(e)}finally{busy.delete(key);renderTab()}
}
function needMe(){if(me===""){toast("Choose your name first.","err");return false}return true}
function freeSlot(task){for(let i=1;i<=task.max;i++){if(!compKeys.has(S.settings.weekId+"_"+task.id+"_s"+i))return i}return 0}
function buildRecord(task,minutes){
  const s=S.settings,m=member(me),slot=freeSlot(task);
  if(!slot)throw new AppError("All completion slots for this task are used this week. Ask the admin to void a record or raise the limit.","full");
  const rec={member:m.id,memberName:m.name,task:task.id,taskName:task.name,kind:task.kind,week:s.weekId,weekStart:s.weekStart,slot:"s"+slot,
    points:(task.kind==="paid"&&s.paidPointMode==="zero")?0:task.points,at:SERVER_TS};
  if(task.kind==="paid"){rec.minutes=minutes;rec.rateCents=s.rateCents;rec.paymentCents=payFor(minutes,s.rateCents)}
  return{key:s.weekId+"_"+task.id+"_s"+slot,rec};
}
async function saveCompletion(task,minutes){
  const {key,rec}=buildRecord(task,minutes);
  await write(()=>db.ref("completions/"+key).set(rec));
  return rec;
}

  if(d.claim){if(!needMe())return;guarded(d.claim,async()=>{await write(()=>db.ref("tasks/"+d.claim+"/claim").set({member:me,week:S.settings.weekId}));toast("Claimed — saved","ok")})}
  else if(d.release)guarded(d.release,async()=>{await write(()=>db.ref("tasks/"+d.release+"/claim").remove());toast("Released — saved","ok")});
  else if(d.undo)guarded(d.undo,undoLatest(d.undo));
  else if(d.complete){const task=S.tasks.find(x=>x.id===d.complete);if(task.kind==="paid")openPayModal(task);else completeRegular(task)}

});
const undoLatest=id=>async()=>{const c=latestMine(id);if(!c)return;if(c.kind!=="regular")throw new AppError("Paid completions can only be changed by the admin.","x");await write(()=>db.ref("completions/"+c.key).remove());toast("Undone — saved","ok")};

let modalClose=null;
function openModal(html,onCancel){$("modal").innerHTML=html;$("modalWrap").hidden=false;modalClose=onCancel||null}
function closeModal(ok){$("modalWrap").hidden=true;$("modal").innerHTML="";const f=modalClose;modalClose=null;if(!ok&&f)f()}

function openPayModal(task){
  if(!needMe())return;
  const rc=rate();
  openModal('<h3>Complete: '+esc(task.name)+'</h3><p class="hint">How long did it take? Pay = time worked × '+moneyC(rc)+' per hour.</p>'+
    '<div class="grid2"><div class="field"><label for="payH">Hours</label><input type="number" id="payH" min="0" max="12" step="1" value="0" inputmode="numeric"></div><div class="field"><label for="payM">Minutes</label><input type="number" id="payM" min="0" max="59" step="1" value="0" inputmode="numeric"></div></div>'+
    '<div class="quick"><button type="button" class="secondary small" data-q="15">15 min</button><button type="button" class="secondary small" data-q="30">30 min</button><button type="button" class="secondary small" data-q="45">45 min</button><button type="button" class="secondary small" data-q="60">1 hr</button><button type="button" class="secondary small" data-q="120">2 hr</button></div>'+
    '<div class="paybox"><div id="payTime">Time worked: 0m</div><div class="big" id="payAmt">'+moneyC(0)+'</div><div class="lbl" id="payNote"></div></div>'+
    '<div class="row"><button type="button" class="good" id="payOk" disabled>Confirm &amp; save</button><button type="button" class="secondary" id="payNo">Cancel</button></div><div id="payErr" class="status" style="background:#feecee;color:#922b3a;margin-top:10px" hidden></div>');
  const H=$("payH"),M=$("payM"),ok=$("payOk");let sending=false;
  const mins=()=>Math.max(0,Math.floor(Number(H.value)||0))*60+Math.max(0,Math.floor(Number(M.value)||0));
  const upd=()=>{const m=mins(),valid=m>=1&&m<=720&&Number(M.value)<60&&Number(H.value)>=0&&Number(M.value)>=0;
    $("payTime").textContent="Time worked: "+fmtMin(m);$("payAmt").textContent=moneyC(payFor(m,rc));
    $("payNote").textContent=valid?"Rate: "+moneyC(rc)+"/hr. Saved only after the database confirms.":(m>720?"Maximum is 12 hours per entry.":"Enter at least 1 minute (minutes: 0–59).");
    ok.disabled=!valid||sending};
  H.oninput=M.oninput=upd;
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=+b.dataset.q;H.value=Math.floor(q/60);M.value=q%60;upd()});
  $("payNo").onclick=()=>closeModal();
  ok.onclick=async()=>{
    const m=mins();sending=true;ok.disabled=true;ok.textContent="Saving…";$("payErr").hidden=true;
    try{
      if(S.settings.rateCents!==rc)throw new AppError("The hourly rate just changed. Please close and reopen this window.","rate");
      const r=await saveCompletion(task,m);
      closeModal(true);toast("Saved ✔ "+fmtMin(r.minutes)+" × "+moneyC(r.rateCents)+"/hr = "+moneyC(r.paymentCents),"ok");
    }catch(e){$("payErr").hidden=false;$("payErr").textContent=e.message+(e.code==="timeout"?" Do not tap again until you have checked the history table.":"");sending=false;ok.textContent="Confirm & save";upd()}
  };
  upd();H.focus();
}

/* ---------- access key gate + authentication ---------- */
let keyMem=lsGet(KEY_KEY)||"", idleT=null;
const isDenied=e=>e&&(e.code==="PERMISSION_DENIED"||/permission_denied/i.test(e.message||""));
function showGate(msg){document.body.classList.add("locked");$("gate").hidden=false;$("lockBtn").hidden=true;$("gateErr").hidden=!msg;$("gateErr").textContent=msg||"";setTimeout(()=>$("gateKey").focus(),50)}
function hideGate(){document.body.classList.remove("locked");$("gate").hidden=true;$("lockBtn").hidden=false}
$("gateAdmin").addEventListener("click",e=>{e.preventDefault();openMenu()});
$("gateForm").addEventListener("submit",async ev=>{
  ev.preventDefault();const k=$("gateKey").value.trim(),btn=$("gateBtn");if(!k||!auth.currentUser)return;
  btn.disabled=true;btn.textContent="Checking…";$("gateErr").hidden=true;
  try{
    await write(()=>db.ref("sessions/"+auth.currentUser.uid).set(k));
    keyMem=k;lsSet(KEY_KEY,k);$("gateKey").value="";hideGate();startData();
  }catch(e){
    $("gateErr").hidden=false;
    $("gateErr").textContent=e.code==="denied"?"That access key isn’t correct (or no key has been set up yet).":e.message;
  }finally{btn.disabled=false;btn.textContent="Unlock"}
});
async function tryAccess(user){
  try{await db.ref("settings/weekId").once("value");hideGate();startData();return}
  catch(e){if(!isDenied(e)){showBanner("<strong>Can’t reach the database.</strong> "+esc(e.message||""));return}}
  if(keyMem){
    try{await db.ref("sessions/"+user.uid).set(keyMem);hideGate();startData();return}
    catch(e){keyMem="";lsDel(KEY_KEY)}
  }
  showGate();
}
async function lockDevice(){
  stopData();const u=auth.currentUser;
  try{if(u)await db.ref("sessions/"+u.uid).remove()}catch(e){}
  keyMem="";lsDel(KEY_KEY);showGate("This device is locked. Enter the access key to open the chart again.");
}
$("lockBtn").addEventListener("click",lockDevice);
function resetIdle(){clearTimeout(idleT);if(!adminUser)return;idleT=setTimeout(()=>{closeMenu();auth.signOut();toast("Admin logged out after 30 minutes of inactivity.")},30*60000)}
["click","keydown","pointerdown"].forEach(ev=>document.addEventListener(ev,resetIdle,true));

auth.onAuthStateChanged(async user=>{
  adminUser=(user&&!user.isAnonymous)?user:null;isAdmin=false;
  if(!user){
    stopData();
    try{await auth.signInAnonymously()}catch(e){showGate();$("gateErr").hidden=false;$("gateErr").textContent="Sign-in failed: "+((e.code==="auth/operation-not-allowed"||e.code==="auth/admin-restricted-operation")?"enable Anonymous sign-in in Firebase Authentication.":(e.message||e.code))}
    return;
  }
  if(adminUser){
    const last=Date.parse((user.metadata&&user.metadata.lastSignInTime)||"")||Date.now();
    if(Date.now()-last>8*3600e3){auth.signOut();return}
    try{isAdmin=(await db.ref("admins/"+user.uid).once("value")).val()===true}catch(e){}
  }
  $("logoutBtn").hidden=!adminUser;resetIdle();
  if(isAdmin){hideGate();startData()}else await tryAccess(user);
  if($("drawer").classList.contains("open"))renderAdmin();
});

/* ----- exports: database.json backup + Excel ----- */
function download(blobParts,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(blobParts,{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function stamp(){return isoDate(new Date())}
function dbSnapshot(){const d={settings:raw.settings,members:raw.members,tasks:raw.tasks};if(raw.completions)d.completions=raw.completions;return d}
function downloadBackup(){download([JSON.stringify(dbSnapshot(),null,2)],"database-"+stamp()+".json","application/json");lsSet(BACKUP_KEY,String(Date.now()))}
function downloadExcel(full){
  if(!window.XLSX){toast("The Excel library didn’t load. Check your internet connection.","err");return}
  const T=totals(),wb=XLSX.utils.book_new();
  const add=(name,rows,widths)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name)};
  const c2=c=>(Number(c)||0)/100;
  if(full)add("Summary",[["Member","Points (this week)","Chores done","Chores assigned","Paid jobs (week)","Paid hours (week)","Earned (week)","Paid jobs (all)","Paid hours (all)","Earned (all)"]].concat(T.map(t=>[mname(t.id),t.points,t.regDone,t.assigned,t.weekJobs,+(t.weekMin/60).toFixed(2),c2(t.weekEarn),t.allJobs,+(t.allMin/60).toFixed(2),c2(t.allEarn)])),[16,16,12,14,14,14,13,13,13,13]);
  add("Paid earnings",[["Member","Jobs (week)","Hours (week)","Earned (week)","Jobs (all time)","Hours (all time)","Earned (all time)"]].concat(T.map(t=>[mname(t.id),t.weekJobs,+(t.weekMin/60).toFixed(2),c2(t.weekEarn),t.allJobs,+(t.allMin/60).toFixed(2),c2(t.allEarn)])),[16,12,13,13,15,16,16]);
  const paidRows=S.comps.filter(c=>c.kind==="paid").map(c=>[new Date(c.at).toLocaleString(),who(c),c.taskName,c.minutes,+(c.minutes/60).toFixed(2),c2(c.rateCents),c2(c.paymentCents),c.voided?"Voided":"Active",c.voidReason||""]);
  add("Paid history",[["Completed","Member","Task","Minutes","Hours","Hourly rate","Payment","Status","Void reason"]].concat(paidRows),[20,16,28,9,8,11,10,9,24]);
  if(full){
    add("All records",[["Completed","Week start","Member","Task","Type","Points","Minutes","Hourly rate","Payment","Status","Void reason"]].concat(S.comps.map(c=>[new Date(c.at).toLocaleString(),c.weekStart,who(c),c.taskName,c.kind,c.points,c.minutes==null?"":c.minutes,c.rateCents==null?"":c2(c.rateCents),c.paymentCents==null?"":c2(c.paymentCents),c.voided?"Voided":"Active",c.voidReason||""])),[20,12,16,28,9,7,9,11,10,9,24]);
    add("Chores",[["Name","Type","Points","Max per week","Active","Claimed by (this week)","Description"]].concat(S.tasks.map(t=>[t.name,t.kind,t.points,t.max,t.active?"Yes":"No",claimOf(t)?mname(claimOf(t)):"",t.desc||""])),[34,9,8,12,8,20,50]);
  }
  XLSX.writeFile(wb,(full?"chore-chart-":"paid-earnings-")+stamp()+".xlsx");
}

/* ----- Summary ----- */
function adminSummary(p){
  const T=totals(),reg=regularTasks(),done=reg.filter(t=>countFor(t.id)>=t.max).length;
  const weekPay=T.reduce((a,t)=>a+t.weekEarn,0),allPay=T.reduce((a,t)=>a+t.allEarn,0),weekMin=T.reduce((a,t)=>a+t.weekMin,0);
  const last=Number(lsGet(BACKUP_KEY))||0,days=last?Math.floor((Date.now()-last)/864e5):null;
  const stale=days===null||days>=7;
  p.innerHTML=(stale?'<div class="status warn" style="margin-bottom:10px">'+(days===null?"No backup downloaded from this device yet.":"Last backup on this device was "+days+" days ago.")+' Download one below.</div>':'<div class="status" style="margin-bottom:10px">Last backup on this device: '+(days===0?"today":days+" day(s) ago")+'.</div>')+
   '<div class="stat-grid"><div class="stat"><div class="l">Chores done this week</div><div class="v">'+done+' / '+reg.length+'</div></div><div class="stat"><div class="l">Paid this week</div><div class="v">'+moneyC(weekPay)+'</div></div><div class="stat"><div class="l">Paid all-time</div><div class="v">'+moneyC(allPay)+'</div></div><div class="stat"><div class="l">Paid time this week</div><div class="v">'+fmtMin(weekMin)+'</div></div><div class="stat"><div class="l">Hourly rate</div><div class="v">'+moneyC(rate())+'</div></div><div class="stat"><div class="l">Week started</div><div class="v" style="font-size:1rem">'+fmtDate(S.settings.weekStart)+'</div></div></div>'+
   '<div class="tablewrap"><table><thead><tr><th>Member</th><th class="num">Points</th><th class="num">Chores</th><th class="num">Paid jobs (wk)</th><th class="num">Paid (wk)</th><th class="num">Paid (all)</th></tr></thead><tbody>'+T.map(t=>'<tr><td>'+esc(mname(t.id))+'</td><td class="num">'+t.points+'</td><td class="num">'+t.regDone+'/'+t.assigned+'</td><td class="num">'+t.weekJobs+'</td><td class="num">'+moneyC(t.weekEarn)+'</td><td class="num">'+moneyC(t.allEarn)+'</td></tr>').join("")+'</tbody></table></div>'+
   '<div class="section-title">Backup &amp; export</div><div class="row"><button type="button" id="dlXlsx">⬇ Excel (.xlsx)</button><button type="button" class="secondary" id="dlJson">⬇ database.json</button><button type="button" class="secondary" id="upJson">⬆ Restore database.json…</button></div><p class="hint">database.json is a full copy of the data (same format as the starter file; it can be restored here or imported in the Firebase console). The Excel file is for reading, sharing and printing.</p>'+
   '<div class="section-title">Weekly actions</div><div class="row"><button type="button" id="balBtn">Balance assignments</button><button type="button" class="danger" id="newWeek">Start new week now</button></div><p class="hint">Starting a new week clears everyone’s claims and weekly points. All records and earnings are kept.</p>';
  $("dlXlsx").onclick=()=>downloadExcel(true);
  $("dlJson").onclick=()=>{downloadBackup();toast("database.json downloaded","ok");adminSummary($("adminPane"))};
  $("upJson").onclick=()=>$("restoreFile").click();
  $("balBtn").onclick=async()=>{if(!confirm("Assign all unclaimed chores fairly based on each person’s target?"))return;
    const full=confirm("Also re-balance chores that are already assigned (only ones with no completion yet this week)?\n\nOK = re-balance everything not yet done.  Cancel = only assign unclaimed chores.");
    if(await adminWrite(()=>db.ref().update(balanceUpdates(full)),"Assignments balanced ✔"))audit("balance",{full})};
  $("newWeek").onclick=async()=>{if(!confirm("Start a new week now? Claims are cleared and weekly points reset. Records and earnings are kept."))return;
    const n=S.settings.weekNo+1;if(await adminWrite(()=>db.ref().update({"settings/weekNo":n,"settings/weekId":"w"+n,"settings/weekStart":isoDate(new Date())}),"New week started ✔"))audit("new_week",{n})};
}
function balanceUpdates(rebalance){
  const wid=S.settings.weekId,cnt={},reg=regularTasks();S.members.forEach(m=>cnt[m.id]=0);
  const locked=t=>S.comps.some(c=>c.task===t.id&&c.week===wid);
  reg.forEach(t=>{const o=claimOf(t);if(o&&(!rebalance||locked(t)))cnt[o]++});
  const todo=reg.filter(t=>!claimOf(t)||(rebalance&&!locked(t))).sort((a,b)=>b.points-a.points||a.order-b.order),up={};
  todo.forEach(t=>{let best=null,bk=null;S.members.forEach(m=>{const q=m.quota,k=[cnt[m.id]>=q?1:0,cnt[m.id]/Math.max(q,1),cnt[m.id]];
    if(!bk||k[0]<bk[0]||(k[0]===bk[0]&&(k[1]<bk[1]||(k[1]===bk[1]&&k[2]<bk[2])))){best=m.id;bk=k}});
    up["tasks/"+t.id+"/claim"]={member:best,week:wid};cnt[best]++});
  return up;
}
$("restoreFile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    let d;try{d=JSON.parse(r.result)}catch(_){toast("That file isn’t valid JSON.","err");return}
    if(!d||!d.settings||!d.members||!d.tasks||!d.settings.weekId){toast("That doesn’t look like a chore-chart database.json.","err");return}
    if(!confirm("Replace ALL current data with this file ("+Object.keys(d.completions||{}).length+" records)?\n\nA safety copy of the current data will be downloaded first."))return;
    downloadBackup();
    if(await adminWrite(()=>db.ref().update({settings:d.settings,members:d.members,tasks:d.tasks,completions:d.completions||null}),"Data restored ✔"))audit("restore",{file:f.name});
  };r.readAsText(f);
});

}

/* ----- Chores ----- */
const slotsFor=n=>{const o={};for(let i=1;i<=n;i++)o["s"+i]=true;return o};
function taskForm(t){
  const n=!t;t=t||{id:"",name:"",desc:"",kind:"regular",points:2,max:1,active:true};
  return '<form class="card admin-card" data-task="'+t.id+'"><div class="grid2"><div class="field full"><label>'+(n?"New chore name":"Name")+'</label><input type="text" name="name" maxlength="80" required value="'+esc(t.name)+'"></div>'+
   '<div class="field full"><label>Description</label><input type="text" name="desc" maxlength="300" value="'+esc(t.desc||"")+'"></div>'+
   '<div class="field"><label>Type</label><select name="kind"><option value="regular"'+(t.kind==="regular"?" selected":"")+'>Regular (required, unpaid)</option><option value="paid"'+(t.kind==="paid"?" selected":"")+'>Paid (optional, hourly)</option></select></div>'+
   '<div class="field"><label>Points</label><input type="number" name="points" min="0" max="100" step="1" value="'+t.points+'"></div>'+
   '<div class="field"><label>Max completions per week</label><input type="number" name="max" min="1" max="20" step="1" value="'+t.max+'"></div>'+
   (n?'':'<div class="field"><label>Assigned to (this week)</label><select name="assigned"><option value="">Unassigned</option>'+S.members.map(m=>'<option value="'+m.id+'"'+(claimOf(t)===m.id?" selected":"")+'>'+esc(m.name)+'</option>').join("")+'</select></div>')+
   '<div class="field"><label class="check"><input type="checkbox" name="active"'+(t.active?" checked":"")+'> Active (visible to everyone)</label></div></div>'+
   '<div class="row"><button type="submit" class="small">'+(n?"Add chore":"Save")+'</button>'+(n?"":'<button type="button" class="small danger" data-deltask="'+t.id+'">Delete</button>')+'</div></form>';
}
function adminChores(p){
  p.innerHTML='<div class="section-title" style="margin-top:0">Add a chore</div>'+taskForm(null)+'<div class="section-title">Existing chores ('+S.tasks.length+')</div><p class="hint">Deleting a chore never deletes past records — they keep their own copy of the name, points and pay.</p>'+S.tasks.map(taskForm).join("");
  p.onsubmit=async ev=>{const f=ev.target;if(f.dataset.task===undefined)return;ev.preventDefault();const e2=f.elements;
    const id=f.dataset.task||db.ref("tasks").push().key,old=S.tasks.find(x=>x.id===id),max=Number(e2.max.value);
    const rec={name:e2.name.value.trim(),desc:e2.desc.value.trim(),kind:e2.kind.value,points:Number(e2.points.value),max,active:e2.active.checked,order:old?old.order:(S.tasks.reduce((a,t)=>Math.max(a,t.order||0),0)+1),slots:slotsFor(max)};
    if(old&&claimOf(old))rec.claim=old.claim;
    if(old&&e2.assigned){const v=e2.assigned.value;if(v===""){delete rec.claim}else if(claimOf(old)!==v){rec.claim={member:v,week:S.settings.weekId}}}
    if(await adminWrite(()=>db.ref("tasks/"+id).set(rec),"Saved ✔")){audit("task",{id,name:rec.name});adminChores($("adminPane"))}};
  p.onclick=async ev=>{const b=ev.target.closest("[data-deltask]");if(!b)return;const t=S.tasks.find(x=>x.id===b.dataset.deltask);
    if(!confirm("Delete “"+t.name+"”? Past records are kept. To hide it temporarily, untick Active instead."))return;
    if(await adminWrite(()=>db.ref("tasks/"+t.id).remove(),"Deleted")){audit("delete_task",{id:t.id,name:t.name});adminChores($("adminPane"))}};
}

/* ----- Records ----- */
function adminRecords(p){
  const f=recFilter;
  const rows=S.comps.filter(c=>(f.scope==="all"||c.week===S.settings.weekId)&&(!f.member||c.member===f.member)&&(!f.kind||c.kind===f.kind)),shown=rows.slice(0,200);
  p.innerHTML='<div class="grid3"><div class="field"><label>Show</label><select id="rfScope"><option value="week"'+(f.scope==="week"?" selected":"")+'>This week</option><option value="all"'+(f.scope==="all"?" selected":"")+'>All time</option></select></div>'+
   '<div class="field"><label>Member</label><select id="rfMember"><option value="">Everyone</option>'+S.members.map(m=>'<option value="'+m.id+'"'+(m.id===f.member?" selected":"")+'>'+esc(m.name)+'</option>').join("")+'</select></div>'+
   '<div class="field"><label>Type</label><select id="rfKind"><option value="">All</option><option value="regular"'+(f.kind==="regular"?" selected":"")+'>Regular</option><option value="paid"'+(f.kind==="paid"?" selected":"")+'>Paid</option></select></div></div>'+
   '<p class="hint">'+rows.length+' record'+(rows.length===1?"":"s")+(rows.length>200?" (newest 200 shown)":"")+'. Voiding keeps the record (struck through) and can be reversed. Deleting is permanent — download a backup first.</p>'+
   (shown.length?'<div class="tablewrap"><table><thead><tr><th>When</th><th>Member</th><th>Task</th><th class="num">Pts</th><th class="num">Time</th><th class="num">Rate</th><th class="num">Paid</th><th></th></tr></thead><tbody>'+shown.map(c=>'<tr class="'+(c.voided?"voided":"")+'"><td>'+fmtDT(c.at)+'</td><td>'+esc(who(c))+'</td><td>'+esc(c.taskName)+'</td><td class="num">'+c.points+'</td><td class="num">'+(c.minutes?fmtMin(c.minutes):"–")+'</td><td class="num">'+(c.rateCents!=null?moneyC(c.rateCents):"–")+'</td><td class="num">'+(c.paymentCents!=null?moneyC(c.paymentCents):"–")+'</td><td>'+
     (c.voided?'<button type="button" class="small secondary" data-restore="'+c.key+'">Restore</button>':'<button type="button" class="small secondary" data-edit="'+c.key+'">Edit</button> <button type="button" class="small secondary" data-void="'+c.key+'">Void</button>')+' <button type="button" class="small danger" data-del="'+c.key+'">Delete</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No records match.</div>');
  const re=()=>{recFilter={scope:$("rfScope").value,member:$("rfMember").value,kind:$("rfKind").value};adminRecords($("adminPane"))};
  ["rfScope","rfMember","rfKind"].forEach(id=>$(id).onchange=re);
  p.onclick=async ev=>{
    const b=ev.target.closest("[data-void],[data-restore],[data-edit],[data-del]");if(!b)return;const d=b.dataset;
    if(d.void){const why=prompt("Why are you voiding this record? (optional)");if(why===null)return;
      if(await adminWrite(()=>db.ref("completions/"+d.void).update({voided:true,voidReason:(why||"Voided by admin").slice(0,200)}),"Voided ✔"))audit("void",{key:d.void,why})}
    else if(d.restore){if(await adminWrite(()=>db.ref("completions/"+d.restore).update({voided:null,voidReason:null}),"Restored ✔"))audit("restore_record",{key:d.restore})}
    else if(d.del){if(!confirm("Permanently delete this record? This cannot be undone (a voided record is safer)."))return;
      if(await adminWrite(()=>db.ref("completions/"+d.del).remove(),"Deleted"))audit("delete_record",{key:d.del})}
    else if(d.edit)editRecord(S.comps.find(c=>c.key===d.edit));
  };
}
function editRecord(c){
  const paid=c.kind==="paid";
  openModal('<h3>Edit record</h3><p class="hint">'+esc(who(c))+' · '+esc(c.taskName)+' · '+fmtDT(c.at)+'</p><form id="recForm">'+
   (paid?'<div class="grid2"><div class="field"><label>Hours</label><input type="number" name="h" min="0" max="12" step="1" value="'+Math.floor(c.minutes/60)+'"></div><div class="field"><label>Minutes</label><input type="number" name="m" min="0" max="59" step="1" value="'+(c.minutes%60)+'"></div></div><div class="field"><label>Hourly rate used</label><input type="number" name="rate" min="0.01" max="1000" step="0.01" value="'+(c.rateCents/100).toFixed(2)+'"></div><div class="paybox"><div class="lbl">New payment</div><div class="big" id="recPay"></div></div>':"")+
   '<div class="field"><label>Points awarded</label><input type="number" name="points" min="-1000" max="1000" step="1" value="'+c.points+'"></div><div class="row"><button type="submit">Save correction</button><button type="button" class="secondary" id="recNo">Cancel</button></div></form>');
  const f=$("recForm"),e2=f.elements;
  const calc=()=>{const m=(Number(e2.h.value)||0)*60+(Number(e2.m.value)||0);return{m,rc:Math.round(Number(e2.rate.value)*100)}};
  const show=()=>{if(paid){const k=calc();$("recPay").textContent=moneyC(payFor(k.m,k.rc))}};
  if(paid){f.oninput=show;show()}
  $("recNo").onclick=()=>closeModal();
  f.onsubmit=async ev=>{ev.preventDefault();
    const up={points:Number(e2.points.value),edited:true};
    if(paid){const k=calc();if(k.m<1||k.m>720){toast("Time must be 1 minute to 12 hours.","err");return}up.minutes=k.m;up.rateCents=k.rc;up.paymentCents=payFor(k.m,k.rc)}
    if(!confirm("Save this correction? It is recorded in the audit log."))return;
    if(await adminWrite(()=>db.ref("completions/"+c.key).update(up),"Correction saved ✔")){audit("edit_record",{key:c.key,up});closeModal(true)}};
}

/* ----- Audit ----- */
async function adminAudit(p){
  p.innerHTML='<div class="empty">Loading…</div>';
  try{const snap=await db.ref("audit").orderByChild("at").limitToLast(100).once("value"),v=snap.val()||{};
    const rows=Object.keys(v).map(k=>v[k]).sort((a,b)=>b.at-a.at);
    p.innerHTML='<p class="hint">Last 100 admin actions.</p>'+(rows.length?'<div class="tablewrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+fmtDT(r.at)+'</td><td>'+esc(r.by)+'</td><td>'+esc(r.action)+'</td><td style="white-space:normal;max-width:300px;font-size:.78rem;color:#64748b">'+esc(r.details||"")+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Nothing yet.</div>')}
  catch(e){p.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}

/* ----- Security (access key + admin password + rules) ----- */
function adminSecurity(p){
  p.innerHTML='<form class="card" id="keyForm"><h3 style="margin-top:0">Household access key</h3><p class="hint">Everyone must enter this key once per device. Changing it locks every other device until the new key is entered.</p>'+
   '<div class="field"><label>Current key</label><div class="row"><input type="password" id="curKey" readonly style="flex:1" value="Loading…"><button type="button" class="secondary small" id="showKey">Show</button><button type="button" class="secondary small" id="copyKey">Copy</button></div></div>'+
   '<div class="field"><label>New key (8–64 characters; long and random is safest)</label><div class="row"><input type="text" id="newKey" minlength="8" maxlength="64" autocomplete="off" required style="flex:1"><button type="button" class="secondary small" id="genKey">Generate</button></div></div><button type="submit">Save new key</button></form>'+
   '<form class="card" id="pwForm" style="margin-top:10px"><h3 style="margin-top:0">Change admin password</h3><div class="field"><label>Current password</label><input type="password" name="old" autocomplete="current-password" required></div><div class="field"><label>New password (10+ characters)</label><input type="password" name="n1" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Repeat new password</label><input type="password" name="n2" minlength="10" autocomplete="new-password" required></div><button type="submit">Change password</button></form>'+
   '<div class="card" style="margin-top:10px"><h3 style="margin-top:0">Session &amp; rules</h3><p class="hint">Signed in as '+esc(adminUser.email||adminUser.uid)+'. The login ends after 30 minutes of inactivity, 8 hours at most, or when you log out.</p><div class="row"><button type="button" class="secondary" id="resetMail">Send password-reset email</button><button type="button" class="secondary" id="copyRulesA">Copy security rules</button><button type="button" class="danger" id="logoutNow">Log out</button></div></div>';
  db.ref("accessKey").once("value").then(s=>{$("curKey").value=s.val()||"(not set — add it in the Firebase console)"}).catch(()=>{$("curKey").value="(unavailable)"});
  $("showKey").onclick=()=>{const i=$("curKey");i.type=i.type==="password"?"text":"password";$("showKey").textContent=i.type==="password"?"Show":"Hide"};
  $("copyKey").onclick=async()=>{try{await navigator.clipboard.writeText($("curKey").value);toast("Copied","ok")}catch(e){toast("Copy failed — select and copy manually.","err")}};
  $("genKey").onclick=()=>{const al="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789",b=new Uint8Array(20);crypto.getRandomValues(b);$("newKey").value=Array.from(b,x=>al[x%al.length]).join("")};
  $("keyForm").onsubmit=async ev=>{ev.preventDefault();const k=$("newKey").value.trim();
    if(!confirm("Change the household access key? Every other device will be locked until the new key is entered."))return;
    if(await adminWrite(()=>db.ref("accessKey").set(k),"Access key changed ✔ — share it with the household")){audit("change_access_key",{});$("curKey").value=k;$("newKey").value=""}};
  $("pwForm").onsubmit=async ev=>{ev.preventDefault();const f=ev.target.elements;if(f.n1.value!==f.n2.value){toast("New passwords do not match.","err");return}
    try{const cred=firebase.auth.EmailAuthProvider.credential(adminUser.email,f.old.value);await adminUser.reauthenticateWithCredential(cred);await adminUser.updatePassword(f.n1.value);ev.target.reset();toast("Password changed ✔","ok");audit("change_password",{})}
    catch(e){toast(/wrong|invalid|credential/.test(e.code||"")?"Current password is incorrect.":(e.message||"Could not change password."),"err")}};
  $("resetMail").onclick=async()=>{try{await auth.sendPasswordResetEmail(adminUser.email);toast("Reset email sent to "+adminUser.email,"ok")}catch(e){toast(e.message,"err")}};
  $("copyRulesA").onclick=async()=>{try{await navigator.clipboard.writeText(RULES);toast("Rules copied","ok")}catch(e){toast("Copy failed","err")}};
  $("logoutNow").onclick=()=>$("logoutBtn").click();
}
})();
</script>
</body>
</html>
